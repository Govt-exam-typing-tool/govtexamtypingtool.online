<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Free Online Typing Test | English & Hindi Mangal Typing Practice
</title>

<meta name="description" content="Free typing test for SSC, Railway, Bank and government exams. Practice English and Hindi Mangal typing with WPM and accuracy.">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',Arial,sans-serif;
}


body{
background:#f4f6f9;
color:#333;
}


header{

background:#004aad;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;

}


.logo{

display:flex;
align-items:center;
font-size:18px;
font-weight:bold;
color:white;

}


.logo img{

height:45px;
width:45px;
border-radius:50%;
margin-right:10px;

}


.logo span{

color:#ffd700;

}


nav a{

color:white;
text-decoration:none;
padding:8px 12px;
margin-left:5px;
border-radius:5px;
font-weight:bold;
font-size:14px;

}


nav a:hover,
nav a.active{

background:#ffd700;
color:#004aad;

}



.container{

max-width:1100px;
margin:25px auto;
padding:20px;

}



.card{

background:white;
padding:25px;
border-radius:12px;
box-shadow:0 2px 10px rgba(0,0,0,.1);

}



h1{

color:#004aad;
margin-bottom:15px;

}



/* STATS */


.stats{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;

}


.stat{

background:#004aad;
color:white;
padding:15px;
border-radius:8px;
text-align:center;

}


.stat small{

display:block;
font-size:13px;

}


.stat b{

font-size:25px;

}



/* BUTTON */


.buttons{

display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;

}


button,
select{

padding:10px 15px;
border:2px solid #004aad;
border-radius:6px;
background:white;
font-weight:bold;
cursor:pointer;

}


button.active{

background:#004aad;
color:white;

}



/* TEXT */


.typing-area{

background:#f8faff;
border:3px solid #004aad;
border-radius:10px;
padding:25px;
min-height:250px;

}


#textDisplay{

font-size:28px;
line-height:2;
font-family:Consolas;

}


.mangal{

font-family:Mangal;
font-size:26px;

}


.correct{

color:green;

}


.wrong{

color:red;
background:#fee2e2;

}


.current{

background:#004aad;
color:white;

}



#inputBox{

width:100%;
margin-top:20px;
padding:15px;
font-size:20px;
border:2px solid #004aad;
border-radius:8px;

}



.result{

display:none;
margin-top:20px;
background:#e8f5e9;
padding:20px;
border-radius:10px;
text-align:center;

}



@media(max-width:700px){

.stats{

grid-template-columns:repeat(2,1fr);

}

nav{

margin-top:10px;

}

#textDisplay{

font-size:22px;

}

}


</style>


</head>


<body>


<header>


<div class="logo">

<img src="logo.png">

<span>Govt Exam Typing Tool</span>

</div>


<nav>

<a href="index.html">Home</a>

<a href="typing-test.html" class="active">
Typing Test
</a>

<a href="learn-english.html">
English
</a>

<a href="learn-hindi.html">
Hindi Mangal
</a>

<a href="mock.html">
Mock
</a>


</nav>


</header>



<div class="container">


<div class="card">


<h1>
⌨️ Live Typing Test
</h1>



<div class="stats">


<div class="stat">
<small>Speed</small>
<b id="wpm">0</b>
</div>


<div class="stat">
<small>Accuracy</small>
<b id="accuracy">100%</b>
</div>


<div class="stat">
<small>Time</small>
<b id="time">1:00</b>
</div>


<div class="stat">
<small>Errors</small>
<b id="errors">0</b>
</div>


</div>



<div class="buttons">


<button onclick="setLanguage('english')" id="engBtn" class="active">
English
</button>


<button onclick="setLanguage('hindi')" id="hinBtn">
हिन्दी Mangal
</button>


<select id="duration" onchange="resetTest()">

<option value="60">
1 Minute
</option>

<option value="120">
2 Minutes
</option>

<option value="300">
5 Minutes
</option>

</select>


<button onclick="setMode('practice')" id="practiceBtn" class="active">
Practice
</button>


<button onclick="setMode('exam')" id="examBtn">
Exam
</button>


<button onclick="resetTest()">
🔄 Restart
</button>


</div>



<div class="typing-area">


<div id="textDisplay"></div>


<input id="inputBox"
placeholder="Start typing here..."
autocomplete="off">


</div>



<div class="result" id="result">

<h2>
🎉 Test Complete
</h2>

<p>
Speed:
<b id="finalWpm"></b> WPM
</p>

<p>
Accuracy:
<b id="finalAccuracy"></b>
</p>


</div>



</div>

</div>
<script>

const englishText = [
"the quick brown fox jumps over the lazy dog. typing practice improves speed and accuracy for government exams.",
"government jobs require good typing speed and accuracy. practice daily to achieve your target.",
"computer knowledge and typing skill are important for banking railway and ssc examinations."
];


const hindiText = [
"भारत एक महान देश है। यहां विभिन्न प्रकार की संस्कृति पाई जाती है। रोज अभ्यास करने से टाइपिंग गति बढ़ती है।",
"सरकारी नौकरी के लिए टाइपिंग टेस्ट पास करना आवश्यक है। शुद्धता और गति दोनों महत्वपूर्ण हैं।",
"कंप्यूटर ज्ञान आज के समय में बहुत जरूरी है। नियमित अभ्यास सफलता की कुंजी है।"
];


let language="english";
let mode="practice";

let text="";
let index=0;

let startTime=0;
let timer=null;

let timeLeft=60;
let totalTime=60;

let errors=0;
let typed=0;



const input=document.getElementById("inputBox");
const display=document.getElementById("textDisplay");




function setLanguage(lang){

language=lang;

document.getElementById("engBtn").classList.remove("active");
document.getElementById("hinBtn").classList.remove("active");


if(lang==="english"){

document.getElementById("engBtn").classList.add("active");

display.classList.remove("mangal");

}
else{

document.getElementById("hinBtn").classList.add("active");

display.classList.add("mangal");

}


resetTest();

}




function setMode(m){

mode=m;


document.getElementById("practiceBtn").classList.remove("active");
document.getElementById("examBtn").classList.remove("active");


if(m==="practice"){

document.getElementById("practiceBtn").classList.add("active");

}
else{

document.getElementById("examBtn").classList.add("active");

}


resetTest();

}




function loadText(){

let arr = language==="english" ? englishText : hindiText;

text=arr[Math.floor(Math.random()*arr.length)];



let html="";


for(let i=0;i<text.length;i++){

html+=`<span>${text[i]}</span>`;

}


display.innerHTML=html;


}





function resetTest(){

clearInterval(timer);


timeLeft=parseInt(
document.getElementById("duration").value
);


totalTime=timeLeft;


index=0;
errors=0;
typed=0;


input.value="";


updateTime();


loadText();


updateStats();


document.getElementById("result").style.display="none";


input.disabled=false;


input.focus();


}





function updateTime(){

let min=Math.floor(timeLeft/60);

let sec=timeLeft%60;


document.getElementById("time").innerHTML=

min+":"+sec.toString().padStart(2,"0");

}





function startTimer(){


if(timer) return;


startTime=new Date().getTime();


timer=setInterval(()=>{


timeLeft--;


updateTime();


updateStats();



if(timeLeft<=0){

finishTest();

}


},1000);


}





input.addEventListener("input",function(){


if(!startTime){

startTimer();

}



let value=input.value;


if(value.length>index){


typed++;


let char=value[value.length-1];


if(char===text[index]){


index++;

}

else{


errors++;


if(mode==="exam"){

index++;

}

}


}



showText();


updateStats();



if(index>=text.length){

finishTest();

}



});







function showText(){


let html="";


for(let i=0;i<text.length;i++){


let cls="";


if(i<index){

cls="correct";

}


if(i===index){

cls="current";

}


html+=
`<span class="${cls}">
${text[i]}
</span>`;


}


display.innerHTML=html;


}





function updateStats(){


let elapsed=

(totalTime-timeLeft)/60;


if(elapsed<=0){

elapsed=.01;

}


let words=Math.floor(index/5);


let wpm=Math.round(words/elapsed);


let accuracy=typed?

Math.round(((typed-errors)/typed)*100)

:100;



document.getElementById("wpm").innerHTML=wpm;


document.getElementById("accuracy").innerHTML=
accuracy+"%";


document.getElementById("errors").innerHTML=
errors;



}





function finishTest(){


clearInterval(timer);


input.disabled=true;


let wpm=document.getElementById("wpm").innerHTML;


let acc=document.getElementById("accuracy").innerHTML;



document.getElementById("finalWpm").innerHTML=wpm;


document.getElementById("finalAccuracy").innerHTML=acc;


document.getElementById("result").style.display="block";


}





document.addEventListener("keydown",function(e){


if(e.key==="Tab"){

e.preventDefault();

resetTest();

}


});



resetTest();


</script>


</body>

</html>
