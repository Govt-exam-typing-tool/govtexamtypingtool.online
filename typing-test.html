<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Govt Exam Typing Tool | 30 Min English Hindi Typing Test</title>
<meta name="description" content="Free English Hindi typing practice for SSC Railway Bank High Court exams. 30 Minute long practice.">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f4f7fb;color:#333;}
header{background:#004aad;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.logo{display:flex;align-items:center;font-size:18px;font-weight:bold;color:white;}
.logo img{height:45px;width:45px;border-radius:50%;margin-right:10px;background:white;}
.logo span{color:#ffd700;}
nav a{color:white;text-decoration:none;padding:8px 12px;margin-left:5px;border-radius:5px;font-weight:bold;}
nav a:hover,nav a.active{background:#ffd700;color:#004aad;}
.container{max-width:1200px;margin:25px auto;padding:20px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);}
h1{color:#004aad;margin-bottom:20px;}
.exam-box{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px;}
.exam-btn{padding:15px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.2s;}
.exam-btn.active{background:#004aad;color:white;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat{background:linear-gradient(135deg,#004aad,#007bff);color:white;padding:15px;border-radius:10px;text-align:center;}
.stat small{display:block;}
.stat b{font-size:25px;}
.mode-tabs{display:flex;gap:10px;margin-bottom:20px;}
.mode-btn{flex:1;padding:12px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;font-weight:bold;cursor:pointer;transition:0.2s;}
.mode-btn.active{background:#004aad;color:white;}
.lang-tabs{display:flex;gap:10px;margin-bottom:20px;}
.lang-btn{flex:1;padding:12px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.2s;}
.lang-btn.active{background:#004aad;color:white;}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
select,.btn{padding:10px 15px;border-radius:6px;border:2px solid #004aad;font-weight:bold;}
.btn{background:#004aad;color:white;cursor:pointer;}
.btn-success{background:#16a34a;border-color:#16a34a;}
.btn-danger{background:#dc2626;border-color:#dc2626;}
.passage-box{background:#f8fbff;border:3px solid #004aad;border-radius:10px;padding:20px;margin-bottom:20px;}
.passage-title{font-weight:bold;color:#004aad;margin-bottom:10px;}
#passage{height:220px;overflow-y:auto;font-size:24px;line-height:2.2;word-spacing:5px;white-space:pre-wrap;padding:10px;color:#64748b;scroll-behavior:smooth;}
.correct{color:#16a34a;}
.wrong{color:#fff;background:#dc2626;padding:1px 3px;border-radius:3px;}
.current{background:#004aad;color:white;padding:2px 4px;border-radius:4px;box-shadow:0 0 8px #004aad;}
.typing-box{background:white;border:3px dashed #004aad;padding:20px;border-radius:10px;}
#typingInput{width:100%;height:120px;resize:none;padding:15px;font-size:20px;border:2px solid #004aad;border-radius:8px;outline:none;font-family:'Consolas', monospace;transition:0.2s;}
#typingInput.error{border-color:#dc2626;box-shadow:0 0 8px #dc2626;}
#customSection{display:none;margin-bottom:20px;}
#customText{width:100%;height:150px;padding:15px;font-size:18px;border:2px solid #004aad;border-radius:8px;}
footer{margin-top:30px;background:#004aad;color:white;padding:20px;text-align:center;}
@media(max-width:800px){
.stats,.exam-box{grid-template-columns:repeat(2,1fr);}
.mode-tabs,.lang-tabs{flex-direction:column;}
}
</style>
</head>

<body>

<header>
<div class="logo">
<img src="logo.png">
<span>Govt Exam Typing Tool</span>
</div>
<nav>
<a href="index.html">Home</a>
<a class="active">Typing Test</a>
<a href="learn-english.html">English</a>
<a href="learn-hindi.html">Hindi Mangal</a>
<a href="mock.html">Mock</a>
</nav>
</header>

<div class="container">
<div class="card">
<h1>⌨️ Government Exam Typing Test - 30 Min Practice</h1>

<!-- EXAM SELECTION -->
<div class="exam-box">
<button class="exam-btn active" data-exam="0">SSC</button>
<button class="exam-btn" data-exam="1">Railway</button>
<button class="exam-btn" data-exam="2">Bank</button>
<button class="exam-btn" data-exam="3">High Court</button>
<button class="exam-btn" data-exam="4">Practice</button>
<button class="exam-btn" data-exam="5">Custom</button>
</div>

<!-- STATS -->
<div class="stats">
<div class="stat"><small>Speed</small><b id="wpm">0</b> WPM</div>
<div class="stat"><small>Accuracy</small><b id="accuracy">100</b> %</div>
<div class="stat"><small>Time</small><b id="time">30:00</b></div>
<div class="stat"><small>Errors</small><b id="errors">0</b></div>
</div>

<!-- MODE -->
<div class="mode-tabs">
<button class="mode-btn active" id="practiceMode">✍️ Practice Mode 30Min</button>
<button class="mode-btn" id="examMode">📝 Exam Mode</button>
<button class="mode-btn" id="customMode">📄 Add Text</button>
</div>

<!-- LANGUAGE -->
<div class="lang-tabs">
<button class="lang-btn active" id="englishLang">English</button>
<button class="lang-btn" id="hindiLang">Hindi Mangal</button>
</div>

<!-- CONTROL -->
<div class="controls">
<select id="timeSelect">
<option value="60">1 Minute</option>
<option value="300">5 Minutes</option>
<option value="600">10 Minutes</option>
<option value="900">15 Minutes</option>
<option value="1800" selected>30 Minutes</option>
</select>
<button class="btn btn-danger" id="restart">🔄 Restart</button>
</div>

<!-- CUSTOM -->
<div id="customSection">
<textarea id="customText" placeholder="Paste your paragraph here..."></textarea><br><br>
<button class="btn btn-success" id="startCustom">Start Custom Test</button>
</div>

<!-- PASSAGE -->
<div class="passage-box">
<div class="passage-title">📖 Passage - Auto Scroll Enabled</div>
<div id="passage"></div>
</div>

<!-- TYPING AREA -->
<div class="typing-box" id="typingBox">
<h3 style="color:#004aad;margin-bottom:10px">Type Here 👇</h3>
<textarea id="typingInput" placeholder="Start typing here..." spellcheck="false"></textarea>
</div>

</div>
</div>

<script>
const baseEnglish = [
`The government of India conducts various competitive examinations every year for recruitment of candidates in different departments. Computer knowledge and typing skill have become an important part of many government examinations. Candidates preparing for SSC Railway Banking and High Court recruitment examinations must improve their typing speed with accuracy. Regular practice helps students to increase confidence and perform better in the final typing test. Typing is not only about speed but also about correct spelling proper spacing and minimum mistakes.`,
`Computer education plays an important role in today's world. Government offices use computers for maintaining records preparing documents and managing information. A good typing speed saves time and increases productivity. Students preparing for competitive exams should develop accuracy along with speed. Hard work discipline and continuous practice are the keys to success in any examination.`,
`Time management is very important in every competitive examination. Candidates must divide their time wisely between different sections. Practicing mock tests regularly helps in understanding the exam pattern. Stay calm and focused during the exam. Believe in your preparation and give your best performance. Success will surely come with dedication and hard work.`,
`Digital India is a flagship program of the Government of India. It aims to transform India into a digitally empowered society and knowledge economy. The initiative includes digital infrastructure, digital literacy and digital services. Computer skills are now essential for every job. Typing speed and accuracy are important for data entry operators.`,
`Effective communication is key to success in any workplace. Emails, reports and official documents require proper typing skills. Government employees must be able to type fast and accurately. Regular practice on typing software helps improve speed. Accuracy is more important than speed in official work.`
];

const baseHindi = [
`भारत सरकार विभिन्न विभागों में भर्ती के लिए प्रत्येक वर्ष प्रतियोगी परीक्षाओं का आयोजन करती है। आज के समय में कंप्यूटर ज्ञान और टाइपिंग कौशल सरकारी नौकरी की तैयारी करने वाले विद्यार्थियों के लिए बहुत महत्वपूर्ण है। एसएससी रेलवे बैंक और हाई कोर्ट जैसी परीक्षाओं में टाइपिंग टेस्ट का विशेष महत्व होता है। नियमित अभ्यास करने से गति और शुद्धता दोनों में सुधार होता है।`,
`कंप्यूटर शिक्षा आज के युग में बहुत आवश्यक है। सरकारी कार्यालयों में सभी काम कंप्यूटर पर होते हैं। फाइल बनाना, डाटा एंट्री करना और रिपोर्ट तैयार करना सभी काम कंप्यूटर से होते हैं। इसलिए टाइपिंग सीखना बहुत जरूरी है। रोज अभ्यास करने से टाइपिंग की गति बढ़ती है। समय की बचत होती है।`,
`सफलता के लिए मेहनत और लगन जरूरी है। अगर आप सरकारी नौकरी चाहते हैं तो रोज अभ्यास करें। अपना लक्ष्य निर्धारित करें और उसे प्राप्त करने के लिए कड़ी मेहनत करें। समय का सदुपयोग करें। परीक्षा में घबराएं नहीं। शांत मन से पेपर दें। आपको अवश्य सफलता मिलेगी। निरंतर प्रयास करते रहें।`,
`आज के डिजिटल युग में कंप्यूटर ज्ञान आवश्यक है। इंटरनेट ने पूरी दुनिया को जोड़ दिया है। हम ईमेल भेज सकते हैं, ऑनलाइन कक्षा कर सकते हैं और घर से काम कर सकते हैं। टाइपिंग सभी कंप्यूटर काम की नींव है। इसके बिना कुछ नहीं हो सकता। हर फील्ड में कंप्यूटर है।`,
`लंबे समय तक टाइपिंग करते समय अपने स्वास्थ्य का ध्यान रखें। सीधे बैठें और पीठ सीधी रखें। हर 30 मिनट में ब्रेक लें। आंखों का व्यायाम करें। पानी पीते रहें। गलत तरीके से बैठने से कमर दर्द होता है। स्वास्थ्य सबसे जरूरी है। काम के साथ सेहत भी जरूरी है।`
];

const passages={
  english: baseEnglish,
  hindi: baseHindi
};

let currentLanguage="english";
let currentExamIndex=0;
let fullText = "";
let currentIndex=0;
let timer=null;
let started=false;
let timeLeft=1800;
let errors=0;
let typedCharacters=0;
let currentMode="practice";
let typingInputRef;
let loadedWords = 0;
const CHUNK_SIZE = 500;

function setActiveExam(index){
  document.querySelectorAll('.exam-btn').forEach((btn,i)=>{
    btn.classList.remove('active');
    if(i==index) btn.classList.add('active');
  });
}

function setActiveMode(mode){
  document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));
  document.getElementById(mode+'Mode').classList.add('active');
}

// 30 MIN CHUNK GENERATOR
function generateLongText(minutes){
  let targetWords = minutes * 90;
  let result = "";
  let baseText = currentLanguage === "english"? baseEnglish.join(" ") : baseHindi.join(" ");
  let words = [];
  while(words.length < targetWords){
    words = words.concat(baseText.split(" "));
  }
  words = words.slice(0, targetWords);
  for(let i=0; i<words.length; i+=10){
    result += words.slice(i, i+10).join(" ") + "\n";
  }
  return result.trim();
}

// AUTO SCROLL + HIGHLIGHT
function renderPassage(){
  let start = currentIndex - 150;
  if(start<0) start=0;
  let end = start + 500;
  let visible = fullText.substring(start, end);
  let html = "";
  let typed = typingInputRef.value;

  for(let i=0;i<visible.length;i++){
    let real = start + i;
    let char = visible[i];
    let cls = "";

    if(real === currentIndex){
      cls = "current";
    }
    else if(real < currentIndex){
      if(typed[real] === fullText[real])
        cls = "correct";
      else
        cls = "wrong";
    }
    html += `<span class="${cls}">${char}</span>`;
  }
  document.getElementById("passage").innerHTML = html;

  let currentSpan = document.querySelector('#passage.current');
  if(currentSpan){
    currentSpan.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
}

function updateStats(){
  let minutes = (parseInt(document.getElementById("timeSelect").value)-timeLeft)/60;
  if(minutes<=0) minutes=0.01;
  let words = typedCharacters/5;
  let speed = Math.round(words/minutes);
  let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100;
  document.getElementById("wpm").innerText = speed;
  document.getElementById("accuracy").innerText = accuracy;
  document.getElementById("errors").innerText = errors;
}

function startTimer(){
  if(started) return;
  started = true;
  timer = setInterval(()=>{
    timeLeft--;
    let min = Math.floor(timeLeft/60);
    let sec = timeLeft%60;
    document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0");
    if(timeLeft<=0){finishTest();}
  },1000);
}

function handleTyping(){
  if(!started){startTimer();}
  let typed = typingInputRef.value;
  currentIndex = typed.length;
  typedCharacters = typed.length;
  errors = 0;

  for(let i=0;i<typed.length;i++){
    if(typed[i]!== fullText[i]){errors++;}
  }

  if(currentIndex > fullText.length * 0.8 && currentMode==="practice"){
    let newChunk = generateLongText(10);
    fullText += "\n\n" + newChunk;
    loadedWords += 900;
  }

  if(!fullText.startsWith(typed)){
    typingInputRef.classList.add("error");
  } else {
    typingInputRef.classList.remove("error");
  }

  renderPassage();
  updateStats();

  if(currentIndex >= fullText.length && currentMode!=="practice"){
    finishTest();
  }
}

// EXAM BUTTON CLICK
document.querySelectorAll('.exam-btn').forEach((btn,index)=>{
  btn.onclick=function(){
    setActiveExam(index);
    currentExamIndex = parseInt(btn.dataset.exam);
    restartTest();
  }
});

// MODE BUTTONS
document.getElementById("practiceMode").onclick=function(){
  currentMode="practice"; setActiveMode('practice'); restartTest();
};
document.getElementById("examMode").onclick=function(){
  currentMode="exam"; setActiveMode('exam'); restartTest();
};
document.getElementById("customMode").onclick=function(){
  currentMode="custom"; setActiveMode('custom');
  document.getElementById("customSection").style.display="block";
};

// LANGUAGE SWITCH
document.getElementById("englishLang").onclick=function(){
  currentLanguage="english";
  this.classList.add("active"); document.getElementById("hindiLang").classList.remove("active");
  restartTest();
};
document.getElementById("hindiLang").onclick=function(){
  currentLanguage="hindi";
  this.classList.add("active"); document.getElementById("englishLang").classList.remove("active");
  restartTest();
};

// TIME CHANGE
document.getElementById("timeSelect").onchange=function(){
  timeLeft = parseInt(this.value);
  let min = Math.floor(timeLeft/60);
  document.getElementById("time").innerText = min + ":00";
};

// CUSTOM TEXT
document.getElementById("startCustom").onclick=function(){
  let txt = document.getElementById("customText").value.trim();
  if(txt===""){alert("Please add text"); return;}
  fullText = txt;
  document.getElementById("customSection").style.display="none";
  restartTest();
};

// RESTART
document.getElementById("restart").onclick=restartTest;
function restartTest(){
  clearInterval(timer); timer=null; started=false;
  currentIndex=0; errors=0; typedCharacters=0; loadedWords=0;
  timeLeft = parseInt(document.getElementById("timeSelect").value);
  document.getElementById("time").innerText = Math.floor(timeLeft/60)+":00";
  document.getElementById("typingInput").value="";
  document.getElementById("typingInput").disabled=false;
  document.getElementById("typingInput").classList.remove("error");

  if(currentMode === "practice"){
    fullText = generateLongText(30);
    loadedWords = 2700;
  } else {
    let base = currentLanguage === "english"? passages.english : passages.hindi;
    fullText = base[currentExamIndex] || base[0];
  }

  typingInputRef = document.getElementById("typingInput");
  typingInputRef.addEventListener("input", handleTyping);
  renderPassage(); updateStats();
}

function finishTest(){
  clearInterval(timer); started=false;
  typingInputRef.disabled=true;
  let minutes = (parseInt(document.getElementById("timeSelect").value)-timeLeft)/60;
  if(minutes<=0) minutes=0.01;
  let words = typedCharacters/5;
  let speed = Math.round(words/minutes);
  let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100;
  document.getElementById("typingBox").innerHTML=`
  <div style="text-align:center;padding:30px;">
  <h2 style="color:#004aad">🎉 Test Completed</h2>
  <h3>Speed : ${speed} WPM</h3>
  <p>Accuracy : ${accuracy}%</p>
  <p>Characters : ${typedCharacters}</p>
  <p>Errors : ${errors}</p>
  <button class="btn" onclick="restartTest()">Try Again</button>
  </div>`;
}

window.onload = function(){
  typingInputRef = document.getElementById("typingInput");
  typingInputRef.addEventListener("input", handleTyping);
  restartTest();
}
</script>

<footer>
<p>© 2026 Govt Exam Typing Tool</p>

</footer>

</body>
</html>
