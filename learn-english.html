   <script>


/* ===============================
   VARIABLES
================================ */


let currentText="";

let currentIndex=0;

let errors=0;

let totalTyped=0;

let seconds=0;

let timer=null;

let running=false;

let mode="practice";





const typingInput =
document.getElementById("typingInput");


const textDisplay =
document.getElementById("textDisplay");







/* ===============================
   START TEST
================================ */


function startTest(){


currentIndex=0;

errors=0;

totalTyped=0;

seconds=0;


clearInterval(timer);


running=false;


typingInput.value="";


typingInput.disabled=false;


document.getElementById("resultBox")
.style.display="none";



if(mode==="practice"){


currentText =
generateText();


}



renderText();


updateStats();


typingInput.focus();


}






/* ===============================
   PRACTICE GENERATOR
================================ */


function generateText(){


let result="";



while(result.length < 3000){


let randomWord =

englishWords[
Math.floor(
Math.random()*englishWords.length
)
];


result += randomWord+" ";


}



return result.trim();


}







/* ===============================
   RENDER ONLY VISIBLE AREA
================================ */


function renderText(){


textDisplay.innerHTML="";



let start =
currentIndex-120;



if(start<0)

start=0;



let end =
start+300;



let visible =
currentText.substring(
start,
end
);




for(let i=0;i<visible.length;i++){



let realIndex =
start+i;



let span =
document.createElement("span");



span.innerText =
visible[i];



if(realIndex < currentIndex){


if(
typingInput.value[realIndex]
===
currentText[realIndex]
)

span.className="correct";


else

span.className="incorrect";


}


else if(realIndex===currentIndex){


span.className="current";


}



textDisplay.appendChild(span);



}



}








/* ===============================
   INPUT CHECK
================================ */


typingInput.addEventListener(
"input",
function(){



if(!running){

startTimer();

}



let value=this.value;



if(value.length > currentIndex){



totalTyped++;



if(
value[currentIndex]
!==
currentText[currentIndex]
){


errors++;


}



currentIndex++;


}




/*
Auto add new paragraph
before finishing
*/


if(
currentIndex >
currentText.length-200
){


currentText +=
" "+generateText();



}



renderText();


updateStats();



});








/* ===============================
   TIMER
================================ */


function startTimer(){


running=true;



timer=setInterval(function(){



seconds++;



let min =
Math.floor(seconds/60);



let sec =
seconds%60;



document.getElementById("time")
.innerText =
min+":"+
String(sec)
.padStart(2,"0");



let limit =
parseInt(
document.getElementById("timeSelect")
.value
);



if(seconds>=limit){


finishTest();


}



},1000);


}








/* ===============================
   STATS
================================ */


function updateStats(){



let minutes =
seconds/60;



if(minutes<=0)

minutes=0.01;




let words =
currentIndex/5;




let wpm =
Math.round(
words/minutes
);



let accuracy =
totalTyped?

Math.round(
((totalTyped-errors)
/totalTyped)*100
)

:

100;




document.getElementById("wpm")
.innerText=wpm;



document.getElementById("accuracy")
.innerText=accuracy;



document.getElementById("errors")
.innerText=errors;



}








/* ===============================
   RESULT
================================ */


function finishTest(){


clearInterval(timer);


running=false;



typingInput.disabled=true;



let result =
document.getElementById("resultBox");



result.style.display="block";



result.innerHTML=`

<h2>
🎯 Typing Result
</h2>


<p>
Speed:
<b>
${document.getElementById("wpm").innerText}
</b>
WPM
</p>


<p>
Accuracy:
<b>
${document.getElementById("accuracy").innerText}
</b>
%
</p>


<p>
Errors:
<b>
${errors}
</b>
</p>


<p>
Characters:
<b>
${currentIndex}
</b>
</p>


<p>
Time:
<b>
${seconds}
Seconds
</b>
</p>


`;



}








/* ===============================
   BUTTONS
================================ */


document
.getElementById("restartBtn")
.onclick=function(){


startTest();


};







document
.getElementById("practiceBtn")
.onclick=function(){


mode="practice";


this.classList.add("active");


document
.getElementById("examBtn")
.classList.remove("active");


startTest();


};








document
.getElementById("examBtn")
.onclick=function(){


mode="exam";


this.classList.add("active");


document
.getElementById("practiceBtn")
.classList.remove("active");



currentText =
examParagraphs[
Math.floor(
Math.random()*
examParagraphs.length
)
];


startTest();


};








document
.getElementById("customBtn")
.onclick=function(){


let box =
document.querySelector(".custom-box");


box.style.display="block";


};



</script>

.style.display="none";

}
