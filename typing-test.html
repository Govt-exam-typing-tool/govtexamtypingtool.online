

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Govt Typing Tool v2.3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f4f7fb;color:#333;}
header{background:#004aad;padding:15px 20px;color:white;font-weight:bold;}
.container{max-width:1200px;margin:25px auto;padding:20px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);}
.info-bar{margin-bottom:15px;padding:12px;background:#004aad;color:white;border-radius:8px;display:flex;justify-content:space-between;}
.exam-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.exam-btn{padding:14px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}
.exam-btn.active{background:#004aad;color:white;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat{background:#004aad;color:white;padding:16px;border-radius:10px;text-align:center;}
.lang-tabs{display:flex;gap:10px;margin-bottom:20px;}
.lang-btn{flex:1;padding:12px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}
.lang-btn.active{background:#004aad;color:white;}
#passage{height:280px;overflow-y:auto;font-size:24px;line-height:2.4;padding:12px;background:white;border:2px solid #004aad;border-radius:6px;}
#passage.hindi{font-family:'Mangal';font-size:27px;}
.correct{color:green;}.wrong{background:red;color:white;}.current{background:blue;color:white;}
#typingInput{width:100%;height:130px;padding:15px;font-size:20px;border:2px solid #004aad;border-radius:8px;}
.btn{padding:10px 16px;border-radius:6px;border:2px solid #004aad;background:#004aad;color:white;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>
<header>Govt Exam Typing Tool Pro v2.3</header>
<div class="container"><div class="card">
<h1>⌨️ Professional Typing Test</h1>
<div class="info-bar">
<span>Exam: <span id="examName">SSC</span></span>
<span>Para: <span id="currentPara">1</span>/15</span>
<span>Lang: <span id="langName">English</span></span>
</div>
<div class="exam-box" id="examBox">
<button class="exam-btn active" data-exam="ssc">SSC</button>
<button class="exam-btn" data-exam="railway">Railway</button>
<button class="exam-btn" data-exam="bank">Bank</button>
<button class="exam-btn" data-exam="highcourt">High Court</button>
<button class="exam-btn" data-exam="uppsc">UPPSC</button>
<button class="exam-btn" data-exam="practice">Practice</button>
</div>
<div class="stats">
<div class="stat"><small>Speed</small><b id="wpm">0</b> WPM</div>
<div class="stat"><small>Accuracy</small><b id="accuracy">100</b> %</div>
<div class="stat"><small>Time</small><b id="time">10:00</b></div>
<div class="stat"><small>Errors</small><b id="errors">0</b></div>
</div>
<div class="lang-tabs">
<button class="lang-btn active" id="englishLang">English</button>
<button class="lang-btn" id="hindiLang">Hindi</button>
</div>
<select id="timeSelect"><option value="600" selected>10 Minutes</option><option value="1800">30 Minutes</option></select>
<button class="btn" id="restart">Next Para</button>
<div id="passage"></div>
<textarea id="typingInput" placeholder="Type here..."></textarea>
</div></div>

const examParagraphs = {
  ssc: ["Computer is an essential tool in modern government offices. Every clerk LDC and DEO must have good typing speed and accuracy. The Staff Selection Commission conducts typing tests to ensure that candidates can handle daily office work efficiently. In today's digital world all files letters and reports are prepared on computer. Without typing skills it is impossible to get a government job in SSC. Regular practice is the only way to improve. Start with 10 minutes daily and slowly increase to 30 minutes. Focus first on accuracy then speed will automatically come. Many students make the mistake of looking at the keyboard while typing. This reduces speed. You must learn touch typing. Place your fingers on ASDF JKL keys. This is called home row. From here you can reach all other keys without seeing. Government exams like SSC CHSL CGL and MTS all require typing test. The required speed is usually 35 words per minute in English with 90 percent accuracy. For Hindi it is 30 WPM. The test duration is 10 minutes. You will be given a passage to type. Every mistake will reduce your marks. So practice with official government documents. Read newspapers type them. This will also improve your GK. Remember typing is a skill. Like driving a car it needs practice. Do not get nervous during exam. Take deep breath and start slowly. Once you get rhythm speed will increase. Good luck for your SSC exam preparation. Keep practicing daily and you will definitely achieve your target. Success comes to those who work hard and never give up.",
  "The role of computer in banking sector has increased tremendously. All transactions are now online. This is why banks need fast and accurate typists. IBPS and SBI conduct typing tests for clerk and PO posts. A speed of 40 WPM is considered good for bank jobs. In banks you have to type customer details loan forms deposit slips and many other documents. One small mistake can cause big financial loss. That is why accuracy is more important than speed in banking. Practice banking related words daily. Words like interest principal loan deposit withdrawal transaction should be at your fingertips. Core banking system requires data entry at high speed. Banks prefer candidates who can type without errors. The typing test in banks is usually 10 minutes long. You must maintain 90 percent accuracy. If you make too many mistakes you will fail even with high speed. So practice daily on computer. Use online typing tools. Take mock tests. This will build your confidence. Remember to sit straight while typing. Keep your wrists straight. Take 5 minute break every 30 minutes to avoid pain. Banking sector is growing fast. More branches are opening. This means more jobs. But competition is also high. Good typing skill will give you an edge over others. Start preparing today and achieve your dream bank job.",
  "Indian Railways is the largest employer in India. RRB conducts exams for thousands of posts every year. Typing is mandatory for clerk typist and commercial apprentice posts. The required speed is 30 WPM in English and 25 WPM in Hindi. Railway offices handle huge amount of data daily. Passenger reservations ticket booking freight details all are computerized now. So every railway employee must know computer and typing. The typing test includes passages related to railway operations. Practice words like station train platform ticket PNR reservation. These words come frequently in the test. Time management is very important. You have to type continuously for 10 minutes. If you stop you will lose time. So build stamina. Practice for 15 minutes daily. Then 10 minutes will feel easy. Railway jobs are secure and have good salary. But selection process is tough. Lakhs of students apply. Good typing score can make the difference between selection and rejection. Many candidates fail in typing even after clearing written exam. Do not let this happen to you. Start practicing today. Use this tool daily. Set a target and achieve it. Consistency is the key to success in railway exams.",
  "The judiciary system requires 100 percent accuracy in documentation. High Court and District Court clerks must type judgments orders and case files without any mistake. One wrong word can change the meaning of a legal document. This is why courts conduct strict typing tests. Speed of 35 WPM with full accuracy is required. Legal typing is different from normal typing. You must know legal terms. Words like plaintiff defendant affidavit petition verdict are common. Practice these words daily. Court proceedings are time sensitive. Judges need documents quickly. So typists must be fast and accurate. The typing test includes legal passages. Read law books and type them. This will help you learn both typing and law. Many students find legal typing difficult. But with practice it becomes easy. Remember in courts there is no scope for error. So practice with extra care. Sit in a quiet place while practicing. Focus completely. Avoid distractions. Your future in judiciary depends on this skill. High Court jobs are prestigious. They come with good pay and respect. So work hard and achieve your goal.",
  "Uttar Pradesh Public Service Commission conducts ARO exam. Assistant Review Officer is an important post in UP government. Hindi typing is compulsory for this post. Speed of 25 WPM in Mangal font is required. All government files in UP are in Hindi. So you must be proficient in Hindi typing. Practice government letters orders and notifications. These come in the exam. Learn Kruti Dev and Mangal keyboard layout. Both are used in UP government offices. Accuracy is very important. Government documents must be error free. One mistake can create legal problems. So practice daily for 30 minutes. Type news from Hindi newspapers. This will improve both typing and GK. UPPSC exam is very competitive. Thousands of students appear. Good typing can give you advantage. The typing test is of 10 minutes. You must maintain speed throughout. Do not start fast and then slow down. Maintain steady rhythm. This comes with practice. Use this tool and practice daily. You will definitely succeed in UPPSC ARO exam.",
  "Professional typing requires dedication and consistent daily practice. In today's digital world typing is no longer an optional skill. It is a fundamental requirement for almost every job in government and private sector. Whether you are applying for SSC Banking Railway or any other competitive exam good typing speed can give you a significant advantage over other candidates. The key to becoming a fast typist is not about typing fast from day one. The key is to start slow and focus completely on accuracy. Speed will automatically come once your fingers develop muscle memory. This is called touch typing. In touch typing you do not look at the keyboard. Your eyes remain on the screen and your fingers automatically find the right keys. To learn this you must place your 8 fingers on the home row keys. That is ASDF for left hand and JKL for right hand. Your thumbs will handle the spacebar. Practice this position daily for 15 minutes. Do not get frustrated if you are slow in the beginning. Every expert was once a beginner. After 2 weeks of regular practice you will notice a big difference. Your fingers will start moving automatically. After 1 month you can easily reach 40 WPM. After 3 months 60 to 70 WPM is achievable. But remember consistency is more important than intensity. Practicing 30 minutes daily is far better than practicing 3 hours once a week. Set a fixed time for practice. Morning time is best because your mind is fresh. Take short breaks to avoid wrist pain. Drink water. Sit in proper posture. Keep your back straight and wrists straight. Use this tool to track your WPM and accuracy every day. Set weekly goals and try to beat them. Compete with yourself. Do not compare with others in the beginning. Everyone has a different learning speed. Focus on your own progress. Read books newspapers and type them. This will improve both your typing and general knowledge. For government exams practice official passages. For general improvement type anything you like. The important thing is to keep typing. Make typing a habit like brushing teeth. Once it becomes a habit you will never forget it. Even after years your speed will remain. So start today. Do not wait for tomorrow. Open this tool and start with 10 minutes. Tomorrow increase to 15 minutes. Keep increasing gradually. Soon you will be typing like a professional. Good luck for your journey. Success is waiting for you."],
  railway: ["Indian Railways is the lifeline of India. It connects the whole country. Millions of passengers travel daily. To manage this huge system railways need skilled computer operators. RRB conducts exams for various posts. Typing is compulsory for clerk and typist. The required speed is 30 WPM in English. Practice railway specific terms. This will help you in the exam. Railway offices work 24x7. So speed and accuracy both are important. Many candidates clear written exam but fail in typing. Do not let this happen to you. Start practicing today. Use this tool for 30 minutes daily. You will see improvement in 2 weeks. Railway jobs are secure. They come with many benefits. So work hard and achieve your dream. Good luck for RRB exam."],
  bank: ["Banking sector is one of the fastest growing sectors in India. IBPS and SBI recruit thousands of employees every year. Computer knowledge is mandatory. Typing test is part of selection process. The required speed is 40 WPM. This is higher than other exams. Because banks need fast data entry. Customer service must be quick. So practice daily to achieve this speed. Banking terms are different. Practice words like loan EMI interest deposit. These come in the test. Accuracy is very important. One mistake in amount can cause big loss. So practice with care. Take mock tests. This will build confidence. Banking jobs are lucrative. They offer good salary and growth. So prepare well. Use this tool daily. Practice banking passages. You will succeed. Good luck for IBPS exam."],
  highcourt: ["The judiciary is the backbone of democracy. Courts need accurate documentation. This is why typing skill is important. High Court conducts typing tests for clerks. The required speed is 35 WPM with 100 percent accuracy. Legal documents cannot have mistakes. One wrong word can change meaning. So practice carefully. Learn legal terms. Practice them. This will help you in the exam. Court jobs are prestigious. They come with respect. So prepare well. Use this tool. Practice legal passages. You will succeed. Good luck for High Court exam."],
  uppsc: ["Uttar Pradesh Public Service Commission conducts ARO exam. Assistant Review Officer is an important post in UP government. Hindi typing is compulsory for this post. Speed of 25 WPM in Mangal font is required. All government files in UP are in Hindi. So you must be proficient in Hindi typing. Practice government letters orders and notifications. These come in the exam. Learn Kruti Dev and Mangal keyboard layout. Both are used in UP government offices. Accuracy is very important. Government documents must be error free. One mistake can create legal problems. So practice daily for 30 minutes."],
  practice: ["Professional typing requires dedication and consistent daily practice. In today's digital world typing is no longer an optional skill. It is a fundamental requirement for almost every job in government and private sector. Whether you are applying for SSC Banking Railway or any other competitive exam good typing speed can give you a significant advantage over other candidates. The key to becoming a fast typist is not about typing fast from day one. The key is to start slow and focus completely on accuracy. Speed will automatically come once your fingers develop muscle memory. This is called touch typing. In touch typing you do not look at the keyboard. Your eyes remain on the screen and your fingers automatically find the right keys. To learn this you must place your 8 fingers on the home row keys. That is ASDF for left hand and JKL for right hand. Your thumbs will handle the spacebar. Practice this position daily for 15 minutes. Do not get frustrated if you are slow in the beginning. Every expert was once a beginner. After 2 weeks of regular practice you will notice a big difference. Your fingers will start moving automatically. After 1 month you can easily reach 40 WPM. After 3 months 60 to 70 WPM is achievable. But remember consistency is more important than intensity. Practicing 30 minutes daily is far better than practicing 3 hours once a week. Set a fixed time for practice. Morning time is best because your mind is fresh. Take short breaks to avoid wrist pain. Drink water. Sit in proper posture. Keep your back straight and wrists straight. Use this tool to track your WPM and accuracy every day. Set weekly goals and try to beat them. Compete with yourself. Do not compare with others in the beginning. Everyone has a different learning speed. Focus on your own progress. Read books newspapers and type them. This will improve both your typing and general knowledge. For government exams practice official passages. For general improvement type anything you like. The important thing is to keep typing. Make typing a habit like brushing teeth. Once it becomes a habit you will never forget it. Even after years your speed will remain. So start today. Do not wait for tomorrow. Open this tool and start with 10 minutes. Tomorrow increase to 15 minutes. Keep increasing gradually. Soon you will be typing like a professional. Good luck for your journey. Success is waiting for you."]

  "एससी परीक्षा की तैयारी करने वाले लाखों छात्र हर साल आवेदन करते हैं। लेकिन उनमें से बहुत कम लोग अंतिम रूप से चयनित होते हैं। इसका एक बड़ा कारण टाइपिंग टेस्ट में फेल होना है। छात्र लिखित परीक्षा पर तो बहुत ध्यान देते हैं लेकिन टाइपिंग की प्रैक्टिस नहीं करते। नतीजा यह होता है कि वे टाइपिंग में रह जाते हैं। आप ऐसा न होने दें। आज से ही टाइपिंग की प्रैक्टिस शुरू कर दें। इस टूल का इस्तेमाल करें। इसमें एससी स्तर के बड़े पैराग्राफ हैं। इन्हें रोज टाइप करें। पहले 10 मिनट से शुरू करें। फिर धीरे धीरे समय बढ़ाएं। एक महीने के अंदर आप 30 शब्द प्रति मिनट की गति हासिल कर लेंगे। दो महीने में 40 शब्द प्रति मिनट। लक्ष्य 35 डब्ल्यूपीएम है तो आप आसानी से पास हो जाएंगे। टाइपिंग के दौरान कुछ बातों का ध्यान रखें। सीधे बैठें। कीबोर्ड को टेबल के किनारे से थोड़ी दूरी पर रखें। कलाई सीधी रखें। हर 30 मिनट बाद 5 मिनट का ब्रेक लें। पानी पीते रहें। आंखों को आराम दें। सेहत का ध्यान रखना भी जरूरी है। अगर आप बीमार पड़ गए तो प्रैक्टिस नहीं कर पाएंगे। इसलिए संतुलित आहार लें और पर्याप्त नींद लें। मानसिक तनाव न लें। परीक्षा को लेकर घबराएं नहीं। आपने मेहनत की है तो आप सफल होंगे। बस विश्वास रखें और लगे रहें। एक दिन आप सरकारी नौकरी में होंगे और पीछे मुड़कर देखेंगे तो गर्व महसूस करेंगे कि आपने हार नहीं मानी।"],
  railway: ["भारतीय रेलवे दुनिया का चौथा सबसे बड़ा रेल नेटवर्क है। इसमें लाखों कर्मचारी काम करते हैं। हर साल आरआरबी हजारों पदों के लिए भर्ती निकालता है। क्लर्क टाइपिस्ट कमर्शियल अप्रेंटिस। इन सभी पदों के लिए टाइपिंग अनिवार्य है। अंग्रेजी में 30 शब्द प्रति मिनट और हिंदी में 25 शब्द प्रति मिनट। यह कोई बहुत बड़ी बात नहीं है। लेकिन बहुत से छात्र इसमें फेल हो जाते हैं। कारण है अभ्यास की कमी। वे लिखित परीक्षा पर ध्यान देते हैं और टाइपिंग को भूल जाते हैं। आप ऐसा न करें। आज से ही टाइपिंग की प्रैक्टिस शुरू कर दें। इस टूल का उपयोग करें। इसमें रेलवे स्तर के बड़े पैराग्राफ हैं। इन्हें रोज टाइप करें। रेलवे से संबंधित शब्द जैसे स्टेशन ट्रेन प्लेटफॉर्म टिकट पीएनआर का अभ्यास करें। ये शब्द परीक्षा में आते हैं। 30 मिनट रोज अभ्यास करें। एक महीने में आप 30 डब्ल्यूपीएम तक पहुंच जाएंगे। रेलवे की नौकरी सुरक्षित है। वेतन अच्छा है। सुविधाएं अच्छी हैं। इसलिए मेहनत करें और इसे हासिल करें। आपका भविष्य उज्ज्वल है।"],
  bank: ["बैंकिंग क्षेत्र भारत के सबसे तेजी से बढ़ते क्षेत्रों में से एक है। आईबीपीएस और एसबीआई हर साल हजारों कर्मचारियों की भर्ती करते हैं। कंप्यूटर ज्ञान अनिवार्य है। चयन प्रक्रिया का हिस्सा टाइपिंग टेस्ट है। आवश्यक गति 40 शब्द प्रति मिनट है। यह अन्य परीक्षाओं से अधिक है। क्योंकि बैंकों को तेज डाटा एंट्री की जरूरत होती है। ग्राहक सेवा तेज होनी चाहिए। इसलिए इस गति को हासिल करने के लिए रोज अभ्यास करें। बैंकिंग शब्द अलग होते हैं। लोन ईएमआई ब्याज जमा जैसे शब्दों का अभ्यास करें। ये टेस्ट में आते हैं। शुद्धता बहुत महत्वपूर्ण है। राशि में एक गलती से बड़ा नुकसान हो सकता है। इसलिए सावधानी से अभ्यास करें। मॉक टेस्ट दें। इससे आत्मविश्वास बढ़ेगा। बैंकिंग नौकरियां आकर्षक हैं। वे अच्छा वेतन और विकास प्रदान करती हैं। इसलिए अच्छी तैयारी करें। इस टूल का रोज उपयोग करें। बैंकिंग पैराग्राफ का अभ्यास करें। आप सफल होंगे। आईबीपीएस परीक्षा और बैंकिंग करियर के लिए शुभकामनाएं।"],
  highcourt: ["न्यायपालिका लोकतंत्र की रीढ़ है। अदालतों को सटीक दस्तावेजों की आवश्यकता होती है। इसी कारण टाइपिंग कौशल महत्वपूर्ण है। हाईकोर्ट क्लर्कों के लिए टाइपिंग टेस्ट आयोजित करता है। आवश्यक गति 35 शब्द प्रति मिनट है और 100 प्रतिशत शुद्धता चाहिए। कानूनी दस्तावेजों में गलती नहीं हो सकती। एक गलत शब्द अर्थ बदल सकता है। इसलिए सावधानी से अभ्यास करें। कानूनी शब्द सीखें। उनका अभ्यास करें। इससे आपको परीक्षा में मदद मिलेगी। कोर्ट की नौकरी प्रतिष्ठित है। इसमें सम्मान मिलता है। इसलिए अच्छी तैयारी करें। इस टूल का उपयोग करें। कानूनी पैराग्राफ का अभ्यास करें। आप सफल होंगे। हाईकोर्ट परीक्षा के लिए शुभकामनाएं।"],
  uppsc: ["उत्तर प्रदेश लोक सेवा आयोग एआरओ परीक्षा आयोजित करता है। सहायक समीक्षा अधिकारी यूपी सरकार में एक महत्वपूर्ण पद है। इस पद के लिए हिंदी टाइपिंग अनिवार्य है। मंगल फॉन्ट में 25 शब्द प्रति मिनट की गति आवश्यक है। यूपी में सभी सरकारी फाइलें हिंदी में हैं। इसलिए आपको हिंदी टाइपिंग में निपुण होना चाहिए। सरकारी पत्र आदेश और अधिसूचनाओं का अभ्यास करें। ये परीक्षा में आते हैं। कृतिदेव और मंगल कीबोर्ड लेआउट सीखें। दोनों का उपयोग यूपी सरकारी कार्यालयों में होता है। शुद्धता बहुत महत्वपूर्ण है। सरकारी दस्तावेजों में गलती नहीं होनी चाहिए। एक गलती से कानूनी समस्या हो सकती है। इसलिए रोज 30 मिनट अभ्यास करें। हिंदी समाचार पत्रों से समाचार टाइप करें। इससे टाइपिंग और जीके दोनों सुधरेंगे। यूपीपीएससी परीक्षा बहुत प्रतिस्पर्धी है। हजारों छात्र बैठते हैं। अच्छी टाइपिंग आपको फायदा दे सकती है। टाइपिंग टेस्ट 10 मिनट का है। आपको पूरी गति बनाए रखनी है। धीरे शुरू न करें। स्थिर लय बनाए रखें। यह अभ्यास से आता है। इस टूल का उपयोग करें और रोज अभ्यास करें। आप निश्चित रूप से यूपीपीएससी एआरओ परीक्षा में सफल होंगे।"],
  practice: ["अभ्यास से सिद्धि मिलती है। यह कहावत टाइपिंग पर भी लागू होती है। रोज 30 मिनट अभ्यास से आप 3 महीने में 20 डब्ल्यूपीएम से 60 डब्ल्यूपीएम तक पहुंच सकते हैं। कुंजी है निरंतरता। दिन न छोड़ें। अभ्यास के लिए एक निश्चित समय निर्धारित करें। सुबह का समय सबसे अच्छा है। आपका दिमाग तरोताजा होता है। सरल शब्दों से शुरू करें। फिर वाक्यों पर जाएं। फिर पैराग्राफ। अंत में पूरे पैसेज। कीबोर्ड को न देखें। यह सबसे बड़ी गलती है। अपनी आंखें स्क्रीन पर रखें। आपकी उंगलियां अपने आप सही कुंजी ढूंढ लेंगी। अगर आप गलती करते हैं तो घबराएं नहीं। टाइप करना जारी रखें। समय के साथ शुद्धता सुधरेगी। अपनी प्रगति को ट्रैक करने के लिए ऑनलाइन टाइपिंग टेस्ट लें। हर हफ्ते अपने डब्ल्यूपीएम की तुलना करें। आपको सुधार दिखाई देगा। याद रखें हर कोई धीमी शुरुआत करता है। यहां तक कि पेशेवर टाइपिस्ट भी कभी शुरुआती थे। वे अभ्यास से तेज बने। आप भी कर सकते हैं। खुद पर विश्वास रखें। इस टूल का रोज उपयोग करें। लक्ष्य निर्धारित करें। उन्हें हासिल करें। जल्द ही आप एक पेशेवर की तरह टाइप करेंगे। आपकी टाइपिंग यात्रा और भविष्य की सरकारी परीक्षाओं के लिए शुभकामनाएं।"]
};




let currentLanguage = "english"; let currentExam = "ssc"; let currentParagraphIndex = 0; let fullText = ""; let currentIndex = 0; let timer = null; let started = false; let timeLeft = 600; let errors = 0; let typedCharacters = 0; let allowBackspace = true; let allowHighlight = true;

function updateInfoBar(){ document.getElementById('examName').innerText = currentExam.toUpperCase(); document.getElementById('currentPara').innerText = currentParagraphIndex + 1; document.getElementById('langName').innerText = currentLanguage === 'english'? 'English' : 'Hindi'; }

function setActiveExam(exam){ document.querySelectorAll('.exam-btn').forEach(btn=>{btn.classList.remove('active'); if(btn.dataset.exam === exam) btn.classList.add('active');}); currentExam = exam; currentParagraphIndex = 0; loadParagraph(); }

function loadParagraph(){ let data = currentLanguage === "english"? examParagraphs[currentExam] : examHindiParagraphs[currentExam]; fullText = data[currentParagraphIndex]; currentIndex = 0; document.getElementById("typingInput").value = ""; renderPassage(); updateInfoBar(); }

function renderPassage(){ let html = ""; let typed = document.getElementById("typingInput").value; for(let i=0;i<fullText.length;i++){ let cls = ""; if(i === currentIndex){cls = "current";} else if(i < currentIndex){cls = typed[i] === fullText[i]? 'correct' : 'wrong';} html += `<span class="${cls}">${fullText[i]}</span>`; } document.getElementById("passage").innerHTML = html; }

function updateStats(){ let totalTime = parseInt(document.getElementById("timeSelect").value); let minutes = (totalTime-timeLeft)/60; if(minutes<=0) minutes=0.01; let words = typedCharacters/5; let speed = Math.round(words/minutes); let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100; document.getElementById("wpm").innerText = speed; document.getElementById("accuracy").innerText = accuracy; document.getElementById("errors").innerText = errors; }

function startTimer(){ if(started) return; started = true; timer = setInterval(()=>{ timeLeft--; let min = Math.floor(timeLeft/60); let sec = timeLeft%60; document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0"); if(timeLeft<=0){clearInterval(timer); started=false; document.getElementById("typingInput").disabled=true;} },1000); }

function handleTyping(e){ if(!started){startTimer();} let typed = e.target.value; currentIndex = typed.length; typedCharacters = typed.length; errors = 0; for(let i=0;i<typed.length;i++){ if(typed[i]!== fullText[i]){errors++;} } renderPassage(); updateStats(); }

document.querySelectorAll('.exam-btn').forEach(btn=>{btn.onclick=function(){setActiveExam(btn.dataset.exam);}});
document.getElementById("englishLang").onclick=function(){currentLanguage="english"; this.classList.add("active"); document.getElementById("hindiLang").classList.remove("active"); document.getElementById("passage").classList.remove("hindi"); document.getElementById("typingInput").classList.remove("hindi"); loadParagraph();};
document.getElementById("hindiLang").onclick=function(){currentLanguage="hindi"; this.classList.add("active"); document.getElementById("englishLang").classList.remove("active"); document.getElementById("passage").classList.add("hindi"); document.getElementById("typingInput").classList.add("hindi"); loadParagraph();};
document.getElementById("restart").onclick=function(){currentParagraphIndex++; if(currentParagraphIndex>=15)currentParagraphIndex=0; loadParagraph(); started=false; timeLeft=parseInt(document.getElementById("timeSelect").value); document.getElementById("time").innerText="10:00";};
document.getElementById("typingInput").addEventListener('input', handleTyping);
window.onload = function(){loadParagraph();};
</script>
