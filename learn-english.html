<script>


/* =========================
   TYPING ENGINE
========================= */


let currentLesson = 0;

let currentText = "";

let currentIndex = 0;

let errors = 0;

let totalTyped = 0;

let seconds = 0;

let timer = null;

let started = false;

let mode = "practice";



const lessonList =
document.getElementById("lessonList");


const textDisplay =
document.getElementById("textDisplay");


const typingInput =
document.getElementById("typingInput");







/* =========================
   LOAD LESSON MENU
========================= */


function loadLessonMenu(){


lessonList.innerHTML="";


lessons.forEach((lesson,index)=>{


let div=document.createElement("div");


div.className="lesson-card";


div.innerHTML=`

<h3>
${lesson.title}
</h3>

<p>
${lesson.keys}
</p>

`;



div.onclick=function(){

openLesson(index);

};



lessonList.appendChild(div);



});


}






/* =========================
   OPEN LESSON
========================= */


function openLesson(index){


currentLesson=index;


document.getElementById("practiceArea")
.style.display="block";



document.getElementById("lessonTitle")
.innerText=
lessons[index].title;



document.getElementById("lessonInfo")
.innerText=
"Practice Keys : "+lessons[index].keys;



startPractice();


}







/* =========================
   CREATE LONG PRACTICE TEXT
========================= */


function generateText(){



let source =
lessons[currentLesson].content;



let output="";



while(output.length < 4000){


let word =
source[
Math.floor(Math.random()*source.length)
];


output += word+" ";


}



return output.trim();



}







/* =========================
   START PRACTICE
========================= */


function startPractice(){



clearInterval(timer);



currentText =
generateText();



currentIndex=0;

errors=0;

totalTyped=0;

seconds=0;

started=false;



typingInput.value="";

typingInput.disabled=false;



document.getElementById("resultBox")
.style.display="none";



document.getElementById("time")
.innerText="00:00";



renderText();


updateStats();


typingInput.focus();



}









/* =========================
   DISPLAY TEXT
========================= */


function renderText(){


textDisplay.innerHTML="";



for(let i=0;i<currentText.length;i++){



let span=document.createElement("span");



span.innerText=currentText[i];



if(i < currentIndex){


if(
typingInput.value[i]
===currentText[i]
)

span.className="correct";


else

span.className="wrong";


}


else if(i===currentIndex){


span.className="current";


}



textDisplay.appendChild(span);



}


}








/* =========================
   INPUT CHECK
========================= */


typingInput.addEventListener(
"input",
function(){



if(!started){


started=true;

startTimer();


}



let value=this.value;



while(
value.length > currentIndex
){



totalTyped++;



if(
value[currentIndex]
!==currentText[currentIndex]
){


errors++;


}



currentIndex++;



/* AUTO NEW PASSAGE */

if(
currentIndex>=currentText.length
){


currentText=
generateText();


currentIndex=0;


typingInput.value="";


}


}



renderText();


updateStats();



}

);









/* =========================
   TIMER
========================= */


function startTimer(){



timer=setInterval(()=>{


seconds++;



let min=
Math.floor(seconds/60);



let sec=
seconds%60;



document.getElementById("time")
.innerText=
min+":"+String(sec).padStart(2,"0");



let limit =
parseInt(
document.getElementById("timeSelect").value
);



if(seconds>=limit){


finishTest();


}



},1000);



}









/* =========================
   STATS
========================= */


function updateStats(){



let minutes =
seconds/60;



if(minutes<=0)

minutes=0.01;



let words =
currentIndex/5;



let wpm =
Math.round(words/minutes);



let accuracy =
totalTyped===0
?
100
:
Math.round(
((totalTyped-errors)
/
totalTyped)
*100
);



document.getElementById("wpm")
.innerText=wpm;



document.getElementById("accuracy")
.innerText=accuracy;



document.getElementById("errors")
.innerText=errors;



}









/* =========================
   RESULT
========================= */


function finishTest(){


clearInterval(timer);


typingInput.disabled=true;



let result =
document.getElementById("resultBox");



result.style.display="block";



result.innerHTML=`

<h2>
🎯 Typing Result
</h2>

<br>

<p>
Speed :
<b>
${document.getElementById("wpm").innerText}
WPM
</b>
</p>


<p>
Accuracy :
<b>
${document.getElementById("accuracy").innerText}%
</b>
</p>


<p>
Errors :
<b>
${errors}
</b>
</p>


<p>
Characters :
<b>
${totalTyped}
</b>
</p>


<p>
Time :
<b>
${seconds}
Seconds
</b>
</p>

`;



}







/* =========================
   BUTTONS
========================= */


function restartTest(){


startPractice();


}







function nextLesson(){


if(
currentLesson < lessons.length-1
){


openLesson(currentLesson+1);


}

else{


alert(
"All lessons completed"
);


}


}







/* =========================
   MODE
========================= */


document
.getElementById("practiceBtn")
.onclick=function(){


mode="practice";


this.classList.add("active");


document
.getElementById("examBtn")
.classList.remove("active");


};





document
.getElementById("examBtn")
.onclick=function(){


mode="exam";


this.classList.add("active");


document
.getElementById("practiceBtn")
.classList.remove("active");


};





</script>
