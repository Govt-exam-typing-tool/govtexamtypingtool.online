<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Govt Exam Typing Tool Pro v2.1 Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f4f7fb;color:#333;}
header{background:#004aad;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:18px;font-weight:bold;color:white;}.logo span{color:#ffd700;}
.container{max-width:1200px;margin:25px auto;padding:20px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);}
h1{color:#004aad;margin-bottom:20px;text-align:center;}
.info-bar{margin-bottom:15px;padding:12px;background:linear-gradient(135deg,#004aad,#007bff);color:white;border-radius:8px;display:flex;justify-content:space-between;flex-wrap:wrap;font-weight:bold;gap:10px}
.info-bar span{color:#ffd700}
.settings{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-bottom:20px;padding:15px;background:#e3f2fd;border-radius:8px;}
.exam-box{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.exam-btn{padding:14px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}
.exam-btn.active{background:#004aad;color:white;}.exam-btn.hidden{display:none!important}
.paragraph-selector{display:none;margin-bottom:20px;padding:15px;background:#fff3cd;border:2px solid #ffc107;border-radius:8px}
.para-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.para-btn{padding:8px;border:1px solid #004aad;background:white;color:#004aad;border-radius:5px;cursor:pointer;font-size:12px;font-weight:bold}
.para-btn.active{background:#004aad;color:white}.para-btn.completed{background:#16a34a;color:white;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat{background:linear-gradient(135deg,#004aad,#007bff);color:white;padding:16px;border-radius:10px;text-align:center;}
.lang-tabs{display:flex;gap:10px;margin-bottom:20px;}
.lang-btn{flex:1;padding:12px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}
.lang-btn.active{background:#004aad;color:white;}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;justify-content:center}
select,.btn{padding:10px 16px;border-radius:6px;border:2px solid #004aad;font-weight:bold;cursor:pointer;font-size:14px}
.btn{background:#004aad;color:white;}
.btn-warning{background:#ffc107;color:#000}.btn-danger{background:#dc2626;}.btn-success{background:#16a34a}.btn-info{background:#0ea5e9}
.passage-box{background:#f8fbff;border:3px solid #004aad;border-radius:10px;padding:20px;margin-bottom:20px;}
#passage{height:280px;overflow-y:auto;font-size:24px;line-height:2.4;white-space:pre-wrap;padding:12px;background:white;border-radius:6px;}
#passage.hindi{font-family:'Mangal','Nirmala UI', sans-serif;font-size:27px;line-height:3.0}
.correct{color:#16a34a;}.wrong{color:#fff;background:#dc2626;padding:2px 3px;border-radius:3px;}.current{background:#004aad;color:white;padding:2px 4px;border-radius:4px;}
.typing-box{background:white;border:3px dashed #004aad;padding:20px;border-radius:10px;}
#typingInput{width:100%;height:130px;resize:none;padding:15px;font-size:20px;border:2px solid #004aad;border-radius:8px;}
#typingInput.hindi{font-family:'Mangal','Nirmala UI', sans-serif;font-size:22px}
#resultPopup{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:999;justify-content:center;align-items:center}
.result-card{background:#fff;padding:30px;border-radius:14px;max-width:650px;width:95%;text-align:center;}
</style>
</head>
<body>
<header><div class="logo"><span>Govt Exam Typing Tool Pro</span></div></header>
<div class="container"><div class="card">
<h1>⌨️ Professional Government Exam Typing Test</h1>
<div class="info-bar">
<span>Exam: <span id="examName">SSC</span></span>
<span>Para: <span id="currentPara">1</span>/15</span>
<span>Level: <span id="difficultyTag">Easy</span></span>
<span>Lang: <span id="langName">English</span></span>
</div>
<div class="settings">
<div><b>Backspace:</b> <input type="radio" name="backspace" value="enable" checked> ON <input type="radio" name="backspace" value="disable"> OFF</div>

  ssc: ["Computer is an essential tool in modern government offices. Every clerk, LDC and DEO must have good typing speed and accuracy. The Staff Selection Commission conducts typing tests to ensure that candidates can handle daily office work efficiently. In today's digital world, all files, letters and reports are prepared on computer. Without typing skills, it is impossible to get a government job in SSC. Regular practice is the only way to improve. Start with 10 minutes daily and slowly increase to 30 minutes. Focus first on accuracy, then speed will automatically come. Many students make the mistake of looking at the keyboard while typing. This reduces speed. You must learn touch typing. Place your fingers on ASDF JKL; keys. This is called home row. From here you can reach all other keys without seeing. Government exams like SSC CHSL, CGL and MTS all require typing test. The required speed is usually 35 words per minute in English with 90% accuracy. For Hindi it is 30 WPM. The test duration is 10 minutes. You will be given a passage to type. Every mistake will reduce your marks. So practice with official government documents. Read newspapers, type them. This will also improve your GK. Remember, typing is a skill. Like driving a car, it needs practice. Do not get nervous during exam. Take deep breath and start slowly. Once you get rhythm, speed will increase. Good luck for your SSC exam preparation. Keep practicing daily and you will definitely achieve your target. Success comes to those who work hard and never give up. Typing is not difficult if you practice regularly. Make it a habit and see the results yourself within 2 months.",

  "Uttar Pradesh Public Service Commission conducts ARO exam. Assistant Review Officer is an important post in UP government. Hindi typing is compulsory for this post. Speed of 25 WPM in Mangal font is required. All government files in UP are in Hindi. So you must be proficient in Hindi typing. Practice government letters, orders and notifications. These come in the exam. Learn Kruti Dev and Mangal keyboard layout. Both are used in UP government offices. Accuracy is very important. Government documents must be error free. One mistake can create legal problems. So practice daily for 30 minutes. Type news from Hindi newspapers. This will improve both typing and GK. UPPSC exam is very competitive. Thousands of students appear. Good typing can give you advantage. The typing test is of 10 minutes. You must maintain speed throughout. Do not start fast and then slow down. Maintain steady rhythm. This comes with practice. Use this tool and practice daily. You will definitely succeed in UPPSC ARO exam with good preparation.",
  "Practice makes a man perfect. This is true for typing also. Daily practice of 30 minutes can increase your speed from 20 WPM to 60 WPM in 3 months. The key is consistency. Do not skip days. Set a fixed time for practice. Morning is the best time. Your mind is fresh. Start with simple words. Then move to sentences. Then paragraphs. Finally full passages. Do not look at keyboard. This is the biggest mistake. Keep your eyes on screen. Your fingers will automatically find the keys. If you make a mistake, do not panic. Continue typing. Accuracy will improve with time. Take online typing tests to track progress. Compare your WPM every week. You will see improvement. Remember, everyone starts slow. Even professional typists were beginners once. They became fast through practice. You can also do it. Believe in yourself. Use this tool daily. Set targets. Achieve them. Soon you will be typing like a pro. Good luck for your typing journey and future government exams."],

  "कर्मचारी चयन आयोग कई परीक्षा लेता है। एलडीसी के लिए टाइपिंग जरूरी है। एससी सीएचएसएल और सीजीएल में टाइपिंग अनिवार्य है। बिना टाइपिंग के आप सिलेक्ट नहीं हो सकते। इसलिए रोज अभ्यास करें। ऑनलाइन टूल का इस्तेमाल करें। मॉक टेस्ट दें। इससे आत्मविश्वास बढ़ेगा। सरकारी नौकरी सम्मान की बात है। इसके लिए कड़ी मेहनत करें। आप जरूर सफल होंगे। टाइपिंग एक कौशल है जिसे अभ्यास से सीखा जा सकता है। हार न मानें।",

  "आसान शब्दों से शुरू करें। फिर कठिन पैराग्राफ पर जाएं। धीरे-धीरे लेवल बढ़ाएं। पहले बेसिक सीखें। फिर एडवांस पर जाएं। एससी के पिछले पेपर देखें। उस टाइप के पैराग्राफ टाइप करें। इससे परीक्षा का पैटर्न समझ आएगा। समय का ध्यान रखें। 10 मिनट में पैराग्राफ पूरा करना है। इसलिए स्पीड और एक्यूरेसी दोनों जरूरी है। बैलेंस बनाएं।",

  "एससी सीएचएसएल और सीजीएल में टाइपिंग टेस्ट होता है। सरकारी दस्तावेजों से अभ्यास करें। नोटिफिकेशन, पत्र, रिपोर्ट टाइप करें। इससे असली परीक्षा जैसा फील आएगा। घबराहट नहीं होगी। आप आराम से पेपर दे पाएंगे। तैयारी पूरी होगी।",
  "समय प्रबंधन महत्वपूर्ण है। 10 मिनट लगातार टाइप करना होता है। बीच में रुकें नहीं। पानी पास में रखें। सीधे बैठें। कलाई को आराम दें। 30 मिनट बाद 5 मिनट का ब्रेक लें। सेहत का ध्यान रखें। स्वस्थ रहेंगे तो अच्छा परफॉर्म करेंगे।",
  "कर्मचारी चयन आयोग भारत सरकार के मंत्रालयों में भर्ती करता है। 35 शब्द प्रति मिनट अनिवार्य है। यह कोई बड़ी बात नहीं है। रोज अभ्यास से हो जाएगा। हार न मानें। लगे रहें। सफलता एक दिन जरूर मिलेगी। मेहनत कभी बेकार नहीं जाती।",
  "आज के डिजिटल युग में कंप्यूटर ज्ञान आवश्यक हो गया है। एससी टाइपिंग में गति और शुद्धता जांची जाती है। दोनों का बैलेंस बनाएं। न बहुत तेज न बहुत धीमी। मीडियम स्पीड रखें। गलतियां कम करें।",
  "एससी एलडीसी चयन में लिखित परीक्षा, टाइपिंग टेस्ट और दस्तावेज सत्यापन शामिल है। तीनों में पास होना जरूरी है। इसलिए सभी पर ध्यान दें। टाइपिंग को हल्के में न लें। यह निर्णायक हो सकता है।",
  "सरकारी संगठन रिकॉर्ड रखने के लिए डाटा एंट्री ऑपरेटर पर निर्भर हैं। इसलिए टाइपिस्ट की मांग हमेशा रहेगी। अच्छी नौकरी है। मेहनत करें और इसे हासिल करें। भविष्य सुरक्षित होगा।",
  "नियमित अभ्यास से एससी टाइपिंग परीक्षा में प्रदर्शन बेहतर होता है। रोज का टारगेट बनाएं। उसे पूरा करें। डायरी में लिखें। प्रगति देखें। मोटिवेशन मिलेगा। आप आगे बढ़ते जाएंगे।"],
  railway: ["रेलवे बड़ा विभाग है। क्लर्क को टाइपिंग आनी चाहिए। रोज अभ्यास करें। आरआरबी में टाइपिंग टेस्ट होता है। 30 शब्द प्रति मिनट चाहिए। यह हासिल करना मुश्किल नहीं है। बस रोज 20 मिनट दें। 1 महीने में आप कर लेंगे। रेलवे की नौकरी अच्छी है। सैलरी भी अच्छी है। भविष्य सुरक्षित है।",
  "भारतीय रेलवे को टाइपिस्ट चाहिए। क्लर्क के लिए 30 शब्द प्रति मिनट चाहिए। स्टेशन, ट्रेन, टिकट जैसे शब्द आएंगे। इनका अभ्यास करें। आरआरबी की वेबसाइट से पैटर्न देखें। उसी हिसाब से तैयारी करें। सफलता मिलेगी। मेहनत करें।",
  "रेलवे की नौकरी सुरक्षित है। सभी कार्यालय काम के लिए टाइपिंग जरूरी है। कंप्यूटर आना जरूरी है। इसलिए अभी से सीख लें। टाइपिंग के साथ कंप्यूटर बेसिक भी सीखें। इंटरव्यू में पूछा जाता है। तैयारी पूरी रखें।",
  "ट्रेन, स्टेशन, टिकट जैसे शब्दों का अभ्यास करें। परीक्षा में मदद मिलेगी। रेलवे से संबंधित पैराग्राफ टाइप करें। इससे नए शब्द सीखेंगे। वोकैबुलरी भी बढ़ेगी। जीके भी सुधरेगा। डबल फायदा होगा।",
  "आरबी हर साल परीक्षा लेता है। जल्दी तैयारी शुरू करें। लास्ट मिनट पर न करें। समय पर शुरू करेंगे तो प्रेशर नहीं होगा। आराम से तैयारी होगी। रिजल्ट अच्छा आएगा।",
  "रेलवे भर्ती बोर्ड विभिन्न पदों के लिए परीक्षा लेता है। टाइपिंग अनिवार्य है। बिना पास किए सिलेक्शन नहीं होगा। इसलिए इसे सीरियसली लें। रोज अभ्यास करें।",
  "रेलवे कार्यालय में यात्री डाटा संभाला जाता है। पीएनआर और आरक्षण जानना जरूरी है। इनसे संबंधित पैराग्राफ आएंगे। पहले से अभ्यास कर लें।",
  "कंप्यूटरीकरण के कारण रेलवे में टाइपिंग अनिवार्य हो गई है। अब सारा काम ऑनलाइन है। इसलिए टाइपिंग आना जरूरी है। सीख लें।",
  "आरबी टाइपिंग में रेलवे संचालन से संबंधित पैराग्राफ आते हैं। ट्रेन की टाइमिंग, प्लेटफॉर्म की जानकारी आदि। इन्हें पढ़ें और टाइप करें।",
  "रेलवे क्लर्क के लिए अंग्रेजी में 30 और हिंदी में 25 शब्द प्रति मिनट चाहिए। दोनों का अभ्यास करें। जिस भाषा में सहूलियत हो उसमें दें।",
  "रेलवे भर्ती बोर्ड भारतीय रेलवे में लिपिकीय पदों के लिए भर्ती करता है। अच्छी सैलरी और सुविधाएं हैं। इसलिए मेहनत करें।",
  "भारतीय रेलवे में कंप्यूटरीकरण के कारण टाइपिंग अनिवार्य हो गई है। हर काम कंप्यूटर पर होता है। टाइपिंग सीखना जरूरी है।",
  "रेलवे कार्यालय प्रतिदिन हजारों यात्रियों के रिकॉर्ड प्रोसेस करते हैं। इसलिए तेज टाइपिंग चाहिए। अभ्यास से गति बढ़ाएं।",

  bank: ["बैंक को तेज टाइपिस्ट चाहिए। आईबीपीएस में टाइपिंग टेस्ट होता है। बैंकिंग शब्द सीखें। लोन, जमा, ब्याज जैसे शब्द। 40 शब्द प्रति मिनट चाहिए। यह टारगेट रखें। रोज अभ्यास करें।",

  "आईबीपीएस पीओ और क्लर्क में चयनित उम्मीदवारों का टाइपिंग टेस्ट होता है। इसे पास करना जरूरी है।",
  "कोर बैंकिंग समाधान में तेज डाटा एंट्री चाहिए। बैंक अनुभवी उम्मीदवारों को प्राथमिकता देते हैं।",

  "आधुनिक बैंकिंग कोर बैंकिंग समाधान पर निर्भर है। शुद्धता महत्वपूर्ण है। एक गलती लाखों का नुकसान कर सकती है।",

  highcourt: ["हाई कोर्ट को शुद्ध टाइपिस्ट चाहिए। कानूनी दस्तावेज में गलती नहीं होनी चाहिए। 35 शब्द प्रति मिनट चाहिए। 100% एक्यूरेसी।",

  "यूपीपीएससी पद के लिए मंगल फॉन्ट में 25 शब्द प्रति मिनट की गति आवश्यक है। इसे हासिल करें।",

  "पेशेवर टाइपिंग में गति, शुद्धता और दस्तावेज संरचना की समझ शामिल है।"]

    let currentLanguage = "english"; let currentExam = "ssc"; let currentParagraphIndex = 0; let fullText = ""; let currentIndex = 0; let timer = null; let started = false; let timeLeft = 600; let errors = 0; let typedCharacters = 0; let allowBackspace = true; let allowHighlight = true; let completedParagraphs = []; let typingInputRef = document.getElementById("typingInput");

function filterExamButtons(){ document.querySelectorAll('.exam-btn').forEach(btn => { btn.classList.remove('hidden'); const exam = btn.dataset.exam; if(currentLanguage === 'english' && exam === 'uppsc') btn.classList.add('hidden'); if(currentLanguage === 'hindi' && exam === 'bank') btn.classList.add('hidden'); }); }

function updateInfoBar(){ document.getElementById('examName').innerText = currentExam.toUpperCase(); document.getElementById('currentPara').innerText = currentParagraphIndex + 1; document.getElementById('langName').innerText = currentLanguage === 'english'? 'English' : 'Hindi'; let level = currentParagraphIndex < 5? 'Easy' : currentParagraphIndex < 10? 'Medium' : 'Hard'; document.getElementById('difficultyTag').innerText = level; }

function setActiveExam(exam){ document.querySelectorAll('.exam-btn').forEach(btn=>{btn.classList.remove('active'); if(btn.dataset.exam === exam) btn.classList.add('active');}); currentExam = exam; currentParagraphIndex = 0; completedParagraphs = []; loadParagraph(); generateParagraphButtons(); }

function generateParagraphButtons(){ const grid = document.getElementById('paraGrid'); grid.innerHTML = ''; for(let i = 0; i < 15; i++){ const btn = document.createElement('button'); btn.className = 'para-btn'; btn.innerText = i + 1; if(i === currentParagraphIndex) btn.classList.add('active'); if(completedParagraphs.includes(i)) btn.classList.add('completed'); btn.onclick = () => {currentParagraphIndex = i; loadParagraph(); document.getElementById('paragraphSelector').style.display = 'none';}; grid.appendChild(btn); } }

function loadParagraph(){ let data = currentLanguage === "english"? examParagraphs[currentExam] : examHindiParagraphs[currentExam]; fullText = data[currentParagraphIndex]; currentIndex = 0; typingInputRef.value = ""; typingInputRef.disabled = false; renderPassage(); updateInfoBar(); generateParagraphButtons(); }

function nextParagraph(){ document.getElementById('resultPopup').style.display = 'none'; if(!completedParagraphs.includes(currentParagraphIndex)){completedParagraphs.push(currentParagraphIndex);} currentParagraphIndex++; if(currentParagraphIndex >= 15){currentParagraphIndex = 0; completedParagraphs = []; alert("🎉 All 15 paragraphs completed! Starting again from 1");} loadParagraph(); started = false; timeLeft = parseInt(document.getElementById("timeSelect").value); document.getElementById("time").innerText = Math.floor(timeLeft/60)+":00"; }

function repeatSameParagraph(){ document.getElementById('resultPopup').style.display = 'none'; loadParagraph(); started = false; timeLeft = parseInt(document.getElementById("timeSelect").value); document.getElementById("time").innerText = Math.floor(timeLeft/60)+":00"; }

document.getElementById('showSelector').onclick = function(){ const panel = document.getElementById('paragraphSelector'); panel.style.display = panel.style.display === 'none'? 'block' : 'none'; };
document.getElementById('repeatPara').onclick = function(){ repeatSameParagraph(); };
document.querySelectorAll('input[name="backspace"]').forEach(radio=>{radio.onchange=function(){allowBackspace = this.value === "enable";}});
document.querySelectorAll('input[name="highlight"]').forEach(radio=>{radio.onchange=function(){allowHighlight = this.value === "enable"; renderPassage();}});

function renderPassage(){ if(!allowHighlight){document.getElementById("passage").innerText = fullText; return;} let html = ""; let typed = typingInputRef.value; for(let i=0;i<fullText.length;i++){ let cls = ""; if(i === currentIndex){cls = "current";} else if(i < currentIndex){cls = typed[i] === fullText[i]? 'correct' : 'wrong';} html += `<span class="${cls}">${fullText[i]}</span>`; } document.getElementById("passage").innerHTML = html; let progress = Math.round((currentIndex / fullText.length) * 100); document.getElementById('progress').innerText = progress + '%'; }

function updateStats(){ let totalTime = parseInt(document.getElementById("timeSelect").value); let minutes = (totalTime-timeLeft)/60; if(minutes<=0) minutes=0.01; let words = typedCharacters/5; let speed = Math.round(words/minutes); let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100; document.getElementById("wpm").innerText = speed; document.getElementById("accuracy").innerText = accuracy; document.getElementById("errors").innerText = errors; }

function startTimer(){ if(started) return; started = true; timer = setInterval(()=>{ timeLeft--; let min = Math.floor(timeLeft/60); let sec = timeLeft%60; document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0"); if(timeLeft<=0){finishTest();} },1000); }

function handleTyping(e){ if(!allowBackspace && e.inputType === "deleteContentBackward"){e.preventDefault(); typingInputRef.value = fullText.substring(0, currentIndex); return;} if(!started){startTimer();} let typed = typingInputRef.value; currentIndex = typed.length; typedCharacters = typed.length; errors = 0; for(let i=0;i<typed.length;i++){ if(typed[i]!== fullText[i]){errors++;} } if(!fullText.startsWith(typed)){typingInputRef.classList.add("error");} else {typingInputRef.classList.remove("error");} renderPassage(); updateStats(); if(currentIndex >= fullText.length){finishTest();} }

function finishTest(){ clearInterval(timer); started=false; typingInputRef.disabled=true; let totalTime = parseInt(document.getElementById("timeSelect").value); let minutes = (totalTime-timeLeft)/60; if(minutes<=0) minutes=0.01; let words = typedCharacters/5; let netSpeed = Math.round(words/minutes); let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100; document.getElementById('resWpm').innerText = netSpeed; document.getElementById('resAcc').innerText = accuracy; document.getElementById('resErrors').innerText = errors; document.getElementById('resultPopup').style.display = 'flex'; }

document.querySelectorAll('.exam-btn').forEach(btn=>{btn.onclick=function(){setActiveExam(btn.dataset.exam);}});
document.getElementById("englishLang").onclick=function(){currentLanguage="english"; this.classList.add("active"); document.getElementById("hindiLang").classList.remove("active"); document.getElementById("passage").classList.remove("hindi"); document.getElementById("typingInput").classList.remove("hindi"); filterExamButtons(); loadParagraph();};
document.getElementById("hindiLang").onclick=function(){currentLanguage="hindi"; this.classList.add("active"); document.getElementById("englishLang").classList.remove("active"); document.getElementById("passage").classList.add("hindi"); document.getElementById("typingInput").classList.add("hindi"); filterExamButtons(); loadParagraph();};
document.getElementById("restart").onclick=function(){nextParagraph();};
document.getElementById("timeSelect").onchange=function(){timeLeft = parseInt(this.value); document.getElementById("time").innerText = Math.floor(timeLeft/60)+":00";};
typingInputRef.addEventListener('input', handleTyping);
window.onload = function(){filterExamButtons(); loadParagraph();};
</script>
