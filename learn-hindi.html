   <script>


/* ===============================
   VARIABLES
================================ */


let currentText="";

let currentIndex=0;

let errors=0;

let totalTyped=0;

let seconds=0;

let timer=null;

let running=false;

let mode="practice";



const typingInput =
document.getElementById("typingInput");


const textDisplay =
document.getElementById("textDisplay");







/* ===============================
   START TEST
================================ */


function startTest(){


currentIndex=0;

errors=0;

totalTyped=0;

seconds=0;


clearInterval(timer);


running=false;


typingInput.value="";


typingInput.disabled=false;



document.getElementById("resultBox")
.style.display="none";



if(mode==="practice"){


currentText =
generateHindiText();


}



renderText();


updateStats();


typingInput.focus();


}








/* ===============================
   HINDI MANGAL GENERATOR
================================ */


function generateHindiText(){


let result="";



while(result.length < 3000){



let word =

hindiWords[

Math.floor(
Math.random()*hindiWords.length
)

];



result += word+" ";



}



return result.trim();



}









/* ===============================
   ONLY SHOW WINDOW
================================ */


function renderText(){



textDisplay.innerHTML="";



let start =
currentIndex-120;



if(start<0)

start=0;



let end =
start+300;



let visible =
currentText.substring(
start,
end
);





for(let i=0;i<visible.length;i++){



let realIndex =
start+i;



let span =
document.createElement("span");



span.innerText =
visible[i];




if(realIndex < currentIndex){



if(
typingInput.value[realIndex]
===
currentText[realIndex]
)

span.className="correct";


else

span.className="incorrect";



}



else if(realIndex===currentIndex){


span.className="current";


}



textDisplay.appendChild(span);



}



}








/* ===============================
   INPUT CHECK
================================ */


typingInput.addEventListener(
"input",
function(){



if(!running){

startTimer();

}



let value=this.value;



if(value.length > currentIndex){



totalTyped++;



if(
value[currentIndex]
!==currentText[currentIndex]
)

{


errors++;


}



currentIndex++;



}




/*
 Generate more text
 before end
*/


if(
currentIndex >
currentText.length-200
)

{


currentText +=
" "+generateHindiText();



}



renderText();


updateStats();



});










/* ===============================
   TIMER
================================ */


function startTimer(){


running=true;



timer=setInterval(function(){



seconds++;



let min =
Math.floor(seconds/60);



let sec =
seconds%60;




document.getElementById("time")
.innerText =
min+":"+
String(sec)
.padStart(2,"0");




let limit =
parseInt(
document.getElementById("timeSelect")
.value
);



if(seconds>=limit){


finishTest();


}



},1000);



}









/* ===============================
   STATS
================================ */


function updateStats(){



let minutes =
seconds/60;



if(minutes<=0)

minutes=0.01;



let words =
currentIndex/5;



let wpm =
Math.round(
words/minutes
);




let accuracy =
totalTyped?

Math.round(
((totalTyped-errors)
/totalTyped)*100
)

:

100;





document.getElementById("wpm")
.innerText=wpm;



document.getElementById("accuracy")
.innerText=accuracy;



document.getElementById("errors")
.innerText=errors;



}










/* ===============================
   RESULT
================================ */


function finishTest(){


clearInterval(timer);


running=false;



typingInput.disabled=true;



let result =
document.getElementById("resultBox");



result.style.display="block";



result.innerHTML=

`

<h2>
🎯 Hindi Typing Result
</h2>


<p>
Speed:
<b>
${document.getElementById("wpm").innerText}
</b>
WPM
</p>



<p>
Accuracy:
<b>
${document.getElementById("accuracy").innerText}
</b>
%
</p>



<p>
Errors:
<b>
${errors}
</b>
</p>



<p>
Characters Typed:
<b>
${currentIndex}
</b>
</p>



<p>
Time:
<b>
${seconds}
Seconds
</b>
</p>


`;



}








/* ===============================
   BUTTONS
================================ */


document
.getElementById("restartBtn")
.onclick=function(){


startTest();


};








document
.getElementById("practiceBtn")
.onclick=function(){


mode="practice";


this.classList.add("active");


document
.getElementById("examBtn")
.classList.remove("active");


startTest();


};








document
.getElementById("examBtn")
.onclick=function(){


mode="exam";


this.classList.add("active");


document
.getElementById("practiceBtn")
.classList.remove("active");



currentText =
examParagraphs[

Math.floor(
Math.random()*examParagraphs.length
)

];



startTest();


};





document
.getElementById("customBtn")
.onclick=function(){


document
.querySelector(".custom-box")
.style.display="block";


};



</script>

<script>


/* ===============================
   CUSTOM TEXT
================================ */


function loadCustomText(){


let text =

document.getElementById("customText")
.value.trim();



if(text.length>0){


mode="custom";


currentText=text;


document
.querySelector(".custom-box")
.style.display="none";



document
.getElementById("typingSection")
.style.display="block";



currentIndex=0;

errors=0;

totalTyped=0;

seconds=0;

running=false;


typingInput.value="";


clearInterval(timer);


renderText();


updateStats();


typingInput.focus();



}


}

/* ===============================
   EXAM PASSAGES
================================ */


const examParagraphs=[



"आज के समय में कंप्यूटर ज्ञान और हिंदी टाइपिंग सरकारी परीक्षाओं का महत्वपूर्ण भाग बन चुका है। उम्मीदवारों को नियमित अभ्यास करके अपनी गति और शुद्धता में सुधार करना चाहिए। सही तकनीक और लगातार अभ्यास से बेहतर परिणाम प्राप्त किए जा सकते हैं।",




"सरकारी कार्यालयों में हिंदी भाषा का उपयोग लगातार बढ़ रहा है। दस्तावेज तैयार करने, रिकॉर्ड रखने और जानकारी को सुरक्षित रखने के लिए तेज और सही टाइपिंग आवश्यक होती है।",




"प्रतियोगी परीक्षाओं में समय प्रबंधन और शुद्धता का विशेष महत्व होता है। उम्मीदवारों को प्रतिदिन अभ्यास करके अपनी टाइपिंग गति बढ़ानी चाहिए और गलतियों को कम करना चाहिए।",




"उत्तर प्रदेश और अन्य राज्यों की सरकारी परीक्षाओं में हिंदी टाइपिंग टेस्ट आयोजित किए जाते हैं। अच्छी गति के साथ सही अक्षरों का प्रयोग सफलता के लिए आवश्यक होता है।"

</script>
