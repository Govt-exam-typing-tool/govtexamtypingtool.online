<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi Mangal Typing Tool | 30 Min Practice</title>
<meta name="description" content="Free Hindi Mangal typing practice. 30 Minute typing test with WPM Accuracy Timer.">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f4f7fb;color:#333;}
header{background:#004aad;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
.logo{color:#fff;font-size:18px;font-weight:bold}
.logo span{color:#ffd700}
nav a{color:white;text-decoration:none;padding:8px 12px;margin-left:5px;border-radius:5px;font-weight:bold;}
nav a:hover,nav a.active{background:#ffd700;color:#004aad;}
.container{max-width:1200px;margin:25px auto;padding:20px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);}
h1{color:#004aad;margin-bottom:20px;text-align:center;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}
.stat{background:linear-gradient(135deg,#004aad,#007bff);color:white;padding:18px;border-radius:10px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,0.1);}
.stat small{display:block;font-size:13px;margin-bottom:5px;}
.stat b{font-size:28px;}
.mode-tabs{display:flex;gap:10px;margin-bottom:20px;}
.mode-btn{flex:1;padding:14px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;font-weight:bold;cursor:pointer;transition:0.2s;font-size:15px;}
.mode-btn.active{background:#004aad;color:white;box-shadow:0 0 10px #004aad;}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;justify-content:center;}
select,.btn{padding:12px 18px;border-radius:6px;border:2px solid #004aad;font-weight:bold;font-size:15px;}
.btn{background:#004aad;color:white;cursor:pointer;}
.btn:hover{background:#00337a}
.btn-danger{background:#dc2626;border-color:#dc2626;}
.btn-danger:hover{background:#b91c1c}
.passage-box{background:#f8fbff;border:3px solid #004aad;border-radius:10px;padding:20px;margin-bottom:20px;}
.passage-title{font-weight:bold;color:#004aad;margin-bottom:10px;font-size:16px;}
#passage{height:250px;overflow-y:auto;font-size:28px;line-height:2.8;word-spacing:8px;white-space:pre-wrap;padding:15px;color:#333;scroll-behavior:smooth;font-family:'Mangal','Nirmala UI', sans-serif;background:white;border-radius:6px;}
.correct{color:#16a34a;}
.wrong{color:#fff;background:#dc2626;padding:2px 3px;border-radius:3px;}
.current{background:#004aad;color:white;padding:3px 5px;border-radius:4px;box-shadow:0 0 8px #004aad;}
.typing-box{background:white;border:3px dashed #004aad;padding:20px;border-radius:10px;}
#typingInput{width:100%;height:130px;resize:none;padding:15px;font-size:22px;border:2px solid #004aad;border-radius:8px;outline:none;font-family:'Mangal','Nirmala UI', sans-serif;transition:0.2s;}
#typingInput.error{border-color:#dc2626;box-shadow:0 0 8px #dc2626;}
#customSection{display:none;margin-bottom:20px;}
#customText{width:100%;height:150px;padding:15px;font-size:20px;border:2px solid #004aad;border-radius:8px;font-family:'Mangal','Nirmala UI', sans-serif;}
footer{margin-top:30px;background:#004aad;color:white;padding:20px;text-align:center;}
@media(max-width:800px){
.stats{grid-template-columns:repeat(2,1fr);}
.mode-tabs{flex-direction:column;}
}
</style>
</head>

<body>

<header>
<div class="logo">
<span>Govt Exam Hindi Mangal</span>
</div>
<nav>
<a href="index.html">Home</a>
<a href="typing-test.html">English</a>
<a class="active">Hindi Mangal</a>
<a href="mock.html">Mock</a>
</nav>
</header>

<div class="container">
<div class="card">
<h1>⌨️ हिंदी मंगल टाइपिंग टेस्ट</h1>

<!-- STATS - 4 BOX -->
<div class="stats">
<div class="stat"><small>गति</small><b id="wpm">0</b> WPM</div>
<div class="stat"><small>शुद्धता</small><b id="accuracy">100</b> %</div>
<div class="stat"><small>समय</small><b id="time">30:00</b></div>
<div class="stat"><small>गलती</small><b id="errors">0</b></div>
</div>

<!-- MODE -->
<div class="mode-tabs">
<button class="mode-btn active" id="practiceMode">✍️ अभ्यास मोड 30 मिनट</button>
<button class="mode-btn" id="examMode">📝 परीक्षा मोड</button>
<button class="mode-btn" id="customMode">📄 कस्टम टेक्स्ट</button>
</div>

<!-- CONTROL -->
<div class="controls">
<select id="timeSelect">
<option value="60">1 मिनट</option>
<option value="300">5 मिनट</option>
<option value="600">10 मिनट</option>
<option value="900">15 मिनट</option>
<option value="1800" selected>30 मिनट</option>
</select>
<button class="btn btn-danger" id="restart">🔄 रीस्टार्ट</button>
</div>

<!-- CUSTOM -->
<div id="customSection">
<textarea id="customText" placeholder="यहाँ अपना पैराग्राफ पेस्ट करें..."></textarea><br><br>
<button class="btn" id="startCustom">टेस्ट शुरू करें</button>
</div>

<!-- PASSAGE -->
<div class="passage-box">
<div class="passage-title">📖 पैराग्राफ - ऑटो स्क्रॉल चालू</div>
<div id="passage"></div>
</div>

<!-- TYPING AREA -->
<div class="typing-box" id="typingBox">
<h3 style="color:#004aad;margin-bottom:10px">यहाँ टाइप करें 👇</h3>
<textarea id="typingInput" placeholder="यहाँ टाइप करना शुरू करें..." spellcheck="false"></textarea>
</div>

</div>
</div>

<script>
const baseParagraphs = [
  "भारत सरकार विभिन्न विभागों में भर्ती के लिए प्रत्येक वर्ष प्रतियोगी परीक्षाओं का आयोजन करती है। आज के समय में कंप्यूटर ज्ञान और टाइपिंग कौशल सरकारी नौकरी की तैयारी करने वाले विद्यार्थियों के लिए बहुत महत्वपूर्ण है। बिना कंप्यूटर के आज कोई काम नहीं होता। हर विभाग में डाटा एंट्री का काम होता है। नियमित अभ्यास से सफलता मिलती है।",
  "सरकारी कार्यालयों में हिंदी भाषा का उपयोग लगातार बढ़ रहा है। दस्तावेज तैयार करने, रिकॉर्ड रखने और जानकारी को सुरक्षित रखने के लिए तेज और सही टाइपिंग आवश्यक होती है। इसलिए अभ्यास जरूरी है। हर कर्मचारी को हिंदी टाइपिंग आनी चाहिए। समय की बचत होती है और काम जल्दी होता है।",
  "सफलता रातों रात नहीं मिलती। इसके लिए कड़ी मेहनत और धैर्य चाहिए। अगर आप अच्छे टाइपिस्ट बनना चाहते हैं तो रोज अभ्यास करें। अपना लक्ष्य निर्धारित करें और उसे प्राप्त करें। समय बर्बाद मत करो। निरंतर प्रयास से ही सफलता मिलती है। एक दिन जरूर सफलता मिलेगी।",
  "आज के डिजिटल युग में कंप्यूटर ज्ञान आवश्यक है। इंटरनेट ने पूरी दुनिया को जोड़ दिया है। हम ईमेल भेज सकते हैं, ऑनलाइन कक्षा कर सकते हैं और घर से काम कर सकते हैं। टाइपिंग सभी कंप्यूटर काम की नींव है। इसके बिना कुछ नहीं हो सकता। हर फील्ड में कंप्यूटर है।",
  "लंबे समय तक टाइपिंग करते समय अपने स्वास्थ्य का ध्यान रखें। सीधे बैठें और पीठ सीधी रखें। हर 30 मिनट में ब्रेक लें। आंखों का व्यायाम करें। पानी पीते रहें। गलत तरीके से बैठने से कमर दर्द होता है। स्वास्थ्य सबसे जरूरी है। काम के साथ सेहत भी जरूरी है।"
];

let fullText = "";
let currentIndex = 0;
let timer = null;
let started = false;
let timeLeft = 1800;
let errors = 0;
let typedCharacters = 0;
let currentMode = "practice";
let typingInputRef;
let loadedWords = 0;
const CHUNK_SIZE = 500;

// 30 MIN GENERATOR
function generateLongText(minutes){
  let targetWords = minutes * 90;
  let result = "";
  let baseText = baseParagraphs.join(" ");
  let words = [];
  while(words.length < targetWords){
    words = words.concat(baseText.split(" "));
  }
  words = words.slice(0, targetWords);
  for(let i=0; i<words.length; i+=9){
    result += words.slice(i, i+9).join(" ") + "\n";
  }
  return result.trim();
}

function renderPassage(){
  let start = currentIndex - 150;
  if(start<0) start=0;
  let end = start + 500;
  let visible = fullText.substring(start, end);
  let html = "";
  let typed = typingInputRef.value;

  for(let i=0;i<visible.length;i++){
    let real = start + i;
    let char = visible[i];
    let cls = "";

    if(real === currentIndex){
      cls = "current";
    }
    else if(real < currentIndex){
      if(typed[real] === fullText[real])
        cls = "correct";
      else
        cls = "wrong";
    }
    html += `<span class="${cls}">${char}</span>`;
  }
  document.getElementById("passage").innerHTML = html;

  let currentSpan = document.querySelector('#passage.current');
  if(currentSpan){
    currentSpan.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
}

function updateStats(){
  let minutes = (parseInt(document.getElementById("timeSelect").value)-timeLeft)/60;
  if(minutes<=0) minutes=0.01;
  let words = typedCharacters/5;
  let speed = Math.round(words/minutes);
  let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100;
  document.getElementById("wpm").innerText = speed;
  document.getElementById("accuracy").innerText = accuracy;
  document.getElementById("errors").innerText = errors;
}

function startTimer(){
  if(started) return;
  started = true;
  timer = setInterval(()=>{
    timeLeft--;
    let min = Math.floor(timeLeft/60);
    let sec = timeLeft%60;
    document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0");
    if(timeLeft<=0){finishTest();}
  },1000);
}

function handleTyping(){
  if(!started){startTimer();}
  let typed = typingInputRef.value;
  currentIndex = typed.length;
  typedCharacters = typed.length;
  errors = 0;

  for(let i=0;i<typed.length;i++){
    if(typed[i]!== fullText[i]){errors++;}
  }

  // CHUNK LOADING
  if(currentIndex > fullText.length * 0.8 && currentMode!== "custom"){
    let newChunk = generateLongText(10);
    fullText += "\n\n" + newChunk;
    loadedWords += 900;
  }

  if(!fullText.startsWith(typed)){
    typingInputRef.classList.add("error");
  } else {
    typingInputRef.classList.remove("error");
  }

  renderPassage();
  updateStats();

  if(currentIndex >= fullText.length && currentMode === "exam"){
    finishTest();
  }
}

// MODE BUTTONS
document.getElementById("practiceMode").onclick=function(){
  currentMode="practice";
  document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));
  this.classList.add('active');
  restartTest();
};
document.getElementById("examMode").onclick=function(){
  currentMode="exam";
  document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));
  this.classList.add('active');
  restartTest();
};
document.getElementById("customMode").onclick=function(){
  currentMode="custom";
  document.querySelectorAll('.mode-btn').forEach(btn=>btn.classList.remove('active'));
  this.classList.add('active');
  document.getElementById("customSection").style.display="block";
};

// TIME CHANGE
document.getElementById("timeSelect").onchange=function(){
  timeLeft = parseInt(this.value);
  let min = Math.floor(timeLeft/60);
  document.getElementById("time").innerText = min + ":00";
};

// CUSTOM TEXT
document.getElementById("startCustom").onclick=function(){
  let txt = document.getElementById("customText").value.trim();
  if(txt===""){alert("कृपया टेक्स्ट जोड़ें"); return;}
  fullText = txt;
  document.getElementById("customSection").style.display="none";
  restartTest();
};

// RESTART
document.getElementById("restart").onclick=restartTest;
function restartTest(){
  clearInterval(timer); timer=null; started=false;
  currentIndex=0; errors=0; typedCharacters=0; loadedWords=0;
  timeLeft = parseInt(document.getElementById("timeSelect").value);
  document.getElementById("time").innerText = Math.floor(timeLeft/60)+":00";
  document.getElementById("typingInput").value="";
  document.getElementById("typingInput").disabled=false;
  document.getElementById("typingInput").classList.remove("error");

  let minutes = timeLeft / 60;
  fullText = generateLongText(minutes);
  loadedWords = minutes * 90;

  typingInputRef = document.getElementById("typingInput");
  typingInputRef.addEventListener("input", handleTyping);
  renderPassage(); updateStats();
}

function finishTest(){
  clearInterval(timer); started=false;
  typingInputRef.disabled=true;
  let minutes = (parseInt(document.getElementById("timeSelect").value)-timeLeft)/60;
  if(minutes<=0) minutes=0.01;
  let words = typedCharacters/5;
  let speed = Math.round(words/minutes);
  let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100;
  document.getElementById("typingBox").innerHTML=`
  <div style="text-align:center;padding:30px;">
  <h2 style="color:#004aad">🎉 टेस्ट पूरा हुआ</h2>
  <h3>गति : ${speed} WPM</h3>
  <p>शुद्धता : ${accuracy}%</p>
  <p>कुल अक्षर : ${typedCharacters}</p>
  <p>कुल गलती : ${errors}</p>
  <button class="btn" onclick="restartTest()">फिर से करें</button>
  </div>`;
}

window.onload = function(){
  typingInputRef = document.getElementById("typingInput");
  typingInputRef.addEventListener("input", handleTyping);
  restartTest();
}
</script>

<footer>
<p>© 2026 Govt Exam Hindi Mangal Tool</p>

</footer>

</body>
</html>
