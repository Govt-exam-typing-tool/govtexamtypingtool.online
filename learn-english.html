<script>

let currentStage = 0;
let currentLesson = 0;
let startTime = 0;
let timerStarted = false;
let completed = false;


const lessonContainer = document.getElementById("lessonContainer");
const typingBox = document.getElementById("typingBox");
const lessonTitle = document.getElementById("lessonTitle");
const typingText = document.getElementById("typingText");
const inputBox = document.getElementById("inputBox");



/* CREATE LESSON LIST */

function loadLessons(){

let html="";

lessons.forEach((stage,index)=>{

html += `

<div class="stage-box">

<div class="stage-title" onclick="openStage(${index})">

${stage.stage}

<span>+</span>

</div>


<div class="lesson-list" id="stage${index}">

`;

stage.items.forEach((item,l)=>{

html += `

<div class="lesson-item"
onclick="startLesson(${index},${l})">

<b>${item.title}</b>

<span class="badge">
Practice
</span>

</div>

`;

});


html += `

</div>

</div>

`;

});


lessonContainer.innerHTML=html;


document
.getElementById("stage0")
.classList.add("active");

}





function openStage(index){

let box=document.getElementById("stage"+index);

box.classList.toggle("active");

}




/* START LESSON */

function startLesson(stage,lesson){

currentStage=stage;
currentLesson=lesson;

let data=lessons[stage].items[lesson];


typingBox.style.display="block";


lessonContainer.parentElement.style.display="none";


lessonTitle.innerHTML=data.title;


typingText.innerHTML=data.text;


inputBox.value="";


startTime=0;

timerStarted=false;

completed=false;


document.getElementById("wpm").innerText="0";

document.getElementById("accuracy").innerText="100";


inputBox.focus();


}





/* TYPING CHECK */


inputBox.addEventListener("input",function(){


if(completed)return;


let typed=this.value;

let original=
lessons[currentStage].items[currentLesson].text;



if(!timerStarted && typed.length>0){

startTime=Date.now();

timerStarted=true;

}



let correct=0;


let html="";


for(let i=0;i<original.length;i++){


let char=original[i];


if(i<typed.length){


if(typed[i]===char){

html+=`<span class="correct">${char}</span>`;

correct++;

}

else{

html+=`<span class="wrong">${char}</span>`;

}


}

else if(i===typed.length){


html+=`<span class="current">${char}</span>`;

}

else{


html+=char;


}


}



typingText.innerHTML=html;



let accuracy =
typed.length>0
?
Math.round((correct/typed.length)*100)
:
100;



document.getElementById("accuracy").innerText=accuracy;



let time =
(Date.now()-startTime)/60000;



if(time>0){

let words =
typed.length/5;


let speed =
Math.round(words/time);



document.getElementById("wpm").innerText=speed;

}




if(typed.length>=original.length){


completed=true;


setTimeout(()=>{


alert(
"🎉 Lesson Complete!\n\nSpeed: "
+
document.getElementById("wpm").innerText
+
" WPM\nAccuracy: "
+
accuracy
+
"%"
);


},200);



}



});






/* BACK BUTTON */

function backLesson(){

typingBox.style.display="none";


lessonContainer.parentElement.style.display="block";


inputBox.value="";


}




/* NEXT LESSON */


function nextLesson(){


let stage=lessons[currentStage];


if(currentLesson < stage.items.length-1){


startLesson(
currentStage,
currentLesson+1
);


}

else if(currentStage < lessons.length-1){


startLesson(
currentStage+1,
0
);


}

else{


alert("🎉 All English Lessons Completed!");

backLesson();


}



}





loadLessons();


</script>
