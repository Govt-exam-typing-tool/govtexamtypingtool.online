"अच्छा टाइपिस्ट बनने के लिए सही तकनीक और नियमित अभ्यास आवश्यक है।"],

["पाठ 28: अंतिम अभ्यास",
"आपने हिंदी मंगल टाइपिंग के सभी पाठ पूरे कर लिए हैं। अब मॉक टेस्ट देकर अपनी तैयारी जांचें।"]
]

}

];



let currentStage=0;
let currentLesson=0;
let startTime=0;
let completed=false;



function loadHindiLessons(){

let box=document.getElementById("lessonContainer");

hindiLessons.forEach((stage,s)=>{

let html="";

stage.items.forEach((item,i)=>{

html+=`

<div class="lesson-item" onclick="startHindiLesson(${s},${i})">

<b>${item[0]}</b>

<span class="badge">
Mangal
</span>

</div>

`;

});


box.innerHTML+=`

<div class="stage-box">

<div class="stage-title" onclick="toggleStage(this)">

${stage.stage}

<span>+</span>

</div>


<div class="lesson-list">

${html}

</div>

</div>

`;

});


document.querySelector(".lesson-list").classList.add("active");

}



function toggleStage(el){

el.nextElementSibling.classList.toggle("active");

}



function startHindiLesson(s,i){

currentStage=s;
currentLesson=i;

completed=false;

let lesson=hindiLessons[s].items[i];


document.querySelector(".card").style.display="none";

document.getElementById("typingBox").style.display="block";


document.getElementById("lessonTitle").innerHTML=lesson[0];


document.getElementById("typingText").innerHTML=lesson[1];


document.getElementById("inputBox").value="";


startTime=new Date().getTime();


document.getElementById("inputBox").focus();


}


function backLesson(){

document.querySelector(".card").style.display="block";

document.getElementById("typingBox").style.display="none";

}



function nextLesson(){

if(currentLesson < hindiLessons[currentStage].items.length-1){

startHindiLesson(currentStage,currentLesson+1);

}

else if(currentStage < hindiLessons.length-1){

startHindiLesson(currentStage+1,0);

}

else{

alert("🎉 सभी हिंदी मंगल पाठ पूरे हो गए");

backLesson();

}

}



document.getElementById("inputBox").addEventListener("input",function(){

let typed=this.value;

let target=hindiLessons[currentStage].items[currentLesson][1];


let correct=0;


for(let i=0;i<typed.length;i++){

if(typed[i]===target[i])
correct++;

}


let accuracy=typed.length?
Math.round(correct/typed.length*100):100;


let time=(new Date().getTime()-startTime)/60000;


let words=Math.round(typed.length/5);


let wpm=time?
Math.round(words/time):0;


document.getElementById("wpm").innerHTML=wpm;

document.getElementById("accuracy").innerHTML=accuracy;



if(typed===target){

alert("🎉 पाठ पूरा हुआ");

}

});



loadHindiLessons();


</script>
