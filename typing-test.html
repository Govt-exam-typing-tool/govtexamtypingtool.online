/* PASSAGE WINDOW */

<script>





/* ===============================
   PASSAGE DATA
================================ */


const passages={



english:[



`
The government of India conducts various competitive examinations every year for recruitment of candidates in different departments.

Computer knowledge and typing skill have become an important part of many government examinations.

Candidates preparing for SSC Railway Banking and High Court recruitment examinations must improve their typing speed with accuracy.

Regular practice helps students to increase confidence and perform better in the final typing test.

Typing is not only about speed but also about correct spelling proper spacing and minimum mistakes.

A candidate should practice daily to achieve the required words per minute speed.

The role of technology is increasing rapidly in modern offices.

Every department requires employees who can work efficiently on computers and complete official tasks within the given time.
`,



`
Computer education plays an important role in today's world.

Government offices use computers for maintaining records preparing documents and managing information.

A good typing speed saves time and increases productivity.

Students preparing for competitive exams should develop accuracy along with speed.

Hard work discipline and continuous practice are the keys to success in any examination.
`



],




hindi:[



`
भारत सरकार विभिन्न विभागों में भर्ती के लिए प्रत्येक वर्ष प्रतियोगी परीक्षाओं का आयोजन करती है।

आज के समय में कंप्यूटर ज्ञान और टाइपिंग कौशल सरकारी नौकरी की तैयारी करने वाले विद्यार्थियों के लिए बहुत महत्वपूर्ण है।

एसएससी रेलवे बैंक और हाई कोर्ट जैसी परीक्षाओं में टाइपिंग टेस्ट का विशेष महत्व होता है।

नियमित अभ्यास करने से गति और शुद्धता दोनों में सुधार होता है।
`



];





let currentLanguage="english";


let currentPassage=
passages.english[0];



let currentIndex=0;


let timer=null;


let started=false;


let timeLeft=300;


let errors=0;


let typedCharacters=0;





renderPassage();





/* ===============================
   PASSAGE WINDOW RENDER
================================ */



function renderPassage(){


let start=currentIndex-80;



if(start<0)

start=0;



let end=start+300;



let visible=
currentPassage.substring(
start,
end
);



let html="";



for(let i=0;i<visible.length;i++){


let real=start+i;



if(real===currentIndex){


html+=

`<span class="current">
${visible[i]}
</span>`;


}

else if(real<currentIndex){


if(
document.getElementById("typingInput").value[real]
===
currentPassage[real]
)

html+=

`<span class="correct">
${visible[i]}
</span>`;


else


html+=

`<span class="wrong">
${visible[i]}
</span>`;


}

else{


html+=visible[i];


}



}


document.getElementById("passage").innerHTML=html;


}




/* ===============================
   STATS
================================ */



function updateStats(){


let minutes=(300-timeLeft)/60;


if(minutes<=0)

minutes=0.01;



let words=typedCharacters/5;



let speed=Math.round(words/minutes);



let accuracy=

typedCharacters?

Math.round(
((typedCharacters-errors)
/typedCharacters)*100
)

:

100;



document.getElementById("wpm")
.innerText=speed;


document.getElementById("accuracy")
.innerText=accuracy;


document.getElementById("errors")
.innerText=errors;



}




/* Continue in Part 3/3 */

   
/* ===============================
   TIMER
================================ */


function startTimer(){


if(started)

return;



started=true;



timer=setInterval(()=>{


timeLeft--;



let min=Math.floor(timeLeft/60);

let sec=timeLeft%60;



document.getElementById("time").innerText=

min+":"+
String(sec).padStart(2,"0");




if(timeLeft<=0){


finishTest();


}



},1000);



}









/* ===============================
   TYPING INPUT
================================ */



document
.getElementById("typingInput")
.addEventListener("input",function(){



if(!started){


startTimer();


}



let typed=this.value;



currentIndex=typed.length;


typedCharacters=typed.length;



errors=0;



for(let i=0;i<typed.length;i++){



if(
typed[i]!==currentPassage[i]
)

{

errors++;

}


}





/*
 add more text
 when near end
*/


if(
currentIndex >
currentPassage.length-200
)

{


currentPassage +=
"\n\n"+
currentPassage;


}




renderPassage();


updateStats();



});









/* ===============================
   LANGUAGE SWITCH
================================ */


document
.getElementById("englishLang")
.onclick=function(){


currentLanguage="english";


currentPassage=
passages.english[0];



currentIndex=0;


document
.getElementById("typingInput")
.value="";



renderPassage();



this.classList.add("active");



document
.getElementById("hindiLang")
.classList.remove("active");



};








document
.getElementById("hindiLang")
.onclick=function(){



currentLanguage="hindi";


currentPassage=
passages.hindi[0];



currentIndex=0;



document
.getElementById("typingInput")
.value="";



renderPassage();



this.classList.add("active");



document
.getElementById("englishLang")
.classList.remove("active");



};









/* ===============================
   TIME CHANGE
================================ */



document
.getElementById("timeSelect")
.onchange=function(){



timeLeft=parseInt(this.value);



let min=Math.floor(timeLeft/60);



document
.getElementById("time")
.innerText=
min+":00";



};









/* ===============================
   CUSTOM TEXT
================================ */



document
.getElementById("customMode")
.onclick=function(){



document
.getElementById("customSection")
.style.display="block";



};







document
.getElementById("startCustom")
.onclick=function(){



let txt=

document
.getElementById("customText")
.value
.trim();



if(txt===""){


alert(
"Please add text"
);


return;


}



currentPassage=txt;


currentIndex=0;



document
.getElementById("typingInput")
.value="";



document
.getElementById("customSection")
.style.display="none";



renderPassage();



};









/* ===============================
   RESTART
================================ */



document
.getElementById("restart")
.onclick=function(){



clearInterval(timer);



timer=null;



started=false;



currentIndex=0;



errors=0;



typedCharacters=0;



timeLeft=
parseInt(
document
.getElementById("timeSelect")
.value
);



document
.getElementById("typingInput")
.value="";



document
.getElementById("time")
.innerText=

Math.floor(timeLeft/60)
+":00";



renderPassage();


updateStats();



};









/* ===============================
   RESULT
================================ */



function finishTest(){



clearInterval(timer);



started=false;



document
.getElementById("typingInput")
.disabled=true;



let minutes=(300-timeLeft)/60;



if(minutes<=0)

minutes=0.01;



let words=typedCharacters/5;



let speed=Math.round(
words/minutes
);



let accuracy=

typedCharacters?

Math.round(
((typedCharacters-errors)
/typedCharacters)*100
)

:

100;





document
.querySelector(".typing-box")
.innerHTML=



`

<div style="
text-align:center;
padding:30px;
">


<h2 style="color:#004aad">

🎉 Test Completed

</h2>


<h3>

Speed : ${speed} WPM

</h3>


<p>

Accuracy : ${accuracy}%

</p>


<p>

Characters : ${typedCharacters}

</p>


<p>

Errors : ${errors}

</p>



<button class="btn"
onclick="location.reload()">

Try Again

</button>



</div>

`;



}





</script>
