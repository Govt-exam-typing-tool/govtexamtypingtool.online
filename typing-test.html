body{background:#f4f7fb;color:#333;}
header{background:#004aad;padding:15px 20px;color:white;font-weight:bold;}
.container{max-width:1200px;margin:25px auto;padding:20px;}
.card{background:white;padding:25px;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.1);}
.info-bar{margin-bottom:15px;padding:12px;background:#004aad;color:white;border-radius:8px;display:flex;justify-content:space-between;}

.exam-btn{padding:14px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px;}

.lang-tabs{display:flex;gap:10px;margin-bottom:20px;}
.lang-btn{flex:1;padding:12px;border:2px solid #004aad;background:white;color:#004aad;border-radius:8px;cursor:pointer;font-weight:bold;}
.lang-btn.active{background:#004aad;color:white;}
#passage{height:280px;overflow-y:auto;font-size:24px;line-height:2.4;padding:12px;background:white;border:2px solid #004aad;border-radius:6px;white-space:pre-wrap;}
#passage.hindi{font-family:'Mangal','Noto Sans Devanagari';font-size:27px;}
.correct{color:green;}.wrong{background:red;color:white;}.current{background:blue;color:white;}
#typingInput{width:100%;height:130px;padding:15px;font-size:20px;border:2px solid #004aad;border-radius:8px;margin-top:15px;}
.btn{padding:10px 16px;border-radius:6px;border:2px solid #004aad;background:#004aad;color:white;font-weight:bold;cursor:pointer;margin:10px 0;}
select{padding:10px;border-radius:6px;border:2px solid #004aad;margin-right:10px;}
</style>
</head>

<div class="info-bar">
<span>Exam: <span id="examName">SSC</span></span>
<span>Para: <span id="currentPara">1</span>/5</span>
<span>Lang: <span id="langName">English</span></span>
</div>
<div class="exam-box" id="examBox">
<button class="exam-btn active" data-exam="ssc">SSC</button>
<button class="exam-btn" data-exam="railway">Railway</button>
<button class="exam-btn" data-exam="bank">Bank</button>
<button class="exam-btn" data-exam="highcourt">High Court</button>
<button class="exam-btn" data-exam="uppsc">UPPSC</button>
<button class="exam-btn" data-exam="practice">Practice</button>
</div>
<div class="stats">
<div class="stat"><small>Speed</small><div><b id="wpm">0</b> WPM</div></div>
<div class="stat"><small>Accuracy</small><div><b id="accuracy">100</b> %</div></div>

<div class="stat"><small>Errors</small><div><b id="errors">0</b></div></div>
</div>
<div class="lang-tabs">
<button class="lang-btn active" id="englishLang">English</button>

</div>
<select id="timeSelect"><option value="600" selected>10 Minutes</option><option value="1800">30 Minutes</option></select>
<button class="btn" id="restart">Next Para</button>
<div id="passage"></div>
<textarea id="typingInput" placeholder="Type here..."></textarea>
</div></div>

let currentLanguage = "english";
let currentExam = "ssc";
let currentParagraphIndex = 0;
let fullText = "";
let currentIndex = 0;
let timer = null;
let started = false;
let timeLeft = 600;
let errors = 0;
let typedCharacters = 0;

function updateInfoBar(){
  document.getElementById('examName').innerText = currentExam.toUpperCase();
  let data = currentLanguage === "english"? examParagraphs[currentExam] : examHindiParagraphs[currentExam];
  document.getElementById('currentPara').innerText = (currentParagraphIndex + 1) + '/' + data.length;
  document.getElementById('langName').innerText = currentLanguage === 'english'? 'English' : 'Hindi';
}

function setActiveExam(exam){
  document.querySelectorAll('.exam-btn').forEach(btn=>{
    btn.classList.remove('active');
    if(btn.dataset.exam === exam) btn.classList.add('active');
  });
  currentExam = exam;
  currentParagraphIndex = 0;
  loadParagraph();
}

function loadParagraph(){
  let data = currentLanguage === "english"? examParagraphs[currentExam] : examHindiParagraphs[currentExam];
  if(!data){ data = examParagraphs['ssc']; }
  fullText = data[currentParagraphIndex];
  currentIndex = 0;
  document.getElementById("typingInput").value = "";
  document.getElementById("typingInput").disabled = false;
  started = false;
  if(timer){ clearInterval(timer); timer=null; }
  timeLeft = parseInt(document.getElementById("timeSelect").value);
  let min = Math.floor(timeLeft/60);
  let sec = timeLeft%60;
  document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0");
  renderPassage();
  updateInfoBar();
  updateStats();
}

function renderPassage(){
  let html = "";
  let typed = document.getElementById("typingInput").value;
  for(let i=0;i<fullText.length;i++){
    let cls = "";
    if(i === currentIndex){cls = "current";}
    else if(i < currentIndex){
      cls = typed[i] === fullText[i]? 'correct' : 'wrong';
    }
    html += `<span class="${cls}">${fullText[i]}</span>`;
  }
  document.getElementById("passage").innerHTML = html;
}

function updateStats(){
  let totalTime = parseInt(document.getElementById("timeSelect").value);
  let minutes = (totalTime-timeLeft)/60;
  if(minutes<=0) minutes=0.01;
  let words = typedCharacters/5;
  let speed = Math.round(words/minutes);
  let accuracy = typedCharacters? Math.round(((typedCharacters-errors)/typedCharacters)*100) : 100;
  document.getElementById("wpm").innerText = isFinite(speed)? speed : 0;
  document.getElementById("accuracy").innerText = accuracy;
  document.getElementById("errors").innerText = errors;
}

function startTimer(){
  if(started) return;
  started = true;
  timer = setInterval(()=>{
    timeLeft--;
    let min = Math.floor(timeLeft/60);
    let sec = timeLeft%60;
    document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0");
    if(timeLeft<=0){
      clearInterval(timer);
      started=false;
      document.getElementById("typingInput").disabled=true;
    }
  },1000);
}

function handleTyping(e){
  if(!started){startTimer();}
  let typed = e.target.value;
  currentIndex = typed.length;
  typedCharacters = typed.length;
  errors = 0;
  for(let i=0;i<typed.length;i++){
    if(typed[i]!== fullText[i]){errors++;}
  }
  renderPassage();
  updateStats();

  if(typed.length >= fullText.length){
    clearInterval(timer);
    started = false;
  }
}

document.querySelectorAll('.exam-btn').forEach(btn=>{
  btn.onclick=function(){setActiveExam(btn.dataset.exam);}
});

document.getElementById("englishLang").onclick=function(){
  currentLanguage="english";
  this.classList.add("active");
  document.getElementById("hindiLang").classList.remove("active");
  document.getElementById("passage").classList.remove("hindi");
  document.getElementById("typingInput").classList.remove("hindi");
  currentParagraphIndex=0;
  loadParagraph();
};

document.getElementById("hindiLang").onclick=function(){
  currentLanguage="hindi";
  this.classList.add("active");
  document.getElementById("englishLang").classList.remove("active");
  document.getElementById("passage").classList.add("hindi");
  document.getElementById("typingInput").classList.add("hindi");
  currentParagraphIndex=0;
  loadParagraph();
};

document.getElementById("restart").onclick=function(){
  let data = currentLanguage === "english"? examParagraphs[currentExam] : examHindiParagraphs[currentExam];
  currentParagraphIndex++;
  if(currentParagraphIndex >= data.length) currentParagraphIndex = 0;
  loadParagraph();
};

document.getElementById("timeSelect").onchange=function(){
  timeLeft = parseInt(this.value);
  let min = Math.floor(timeLeft/60);
  let sec = timeLeft%60;
  document.getElementById("time").innerText = min + ":" + String(sec).padStart(2,"0");
};

document.getElementById("typingInput").addEventListener('input', handleTyping);

window.onload = function(){loadParagraph();};
</script>
</body>
</html>
